# Supabase CLI settings for PROJECT GATE (used by `supabase functions deploy`).
project_id = "project-gate"

[functions.checkout]
verify_jwt = false   # the function checks the player's session itself (currentUser)

[functions.portal]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false   # Stripe signs its requests; the signature is verified in code
