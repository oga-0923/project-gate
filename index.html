/* =====================================================================
   ペイント：自分のモンスターの色を塗る（モンスターごとに初回だけ解放）
   ===================================================================== */
const PAINT_COST={C:100,U:150,R:200,L:300};
const PAINT_ROLES=['main','sub','accent'];
const PALETTE=['#e5583c','#ff9a50','#ffd36b','#6cbf4a','#2f8f5a','#4aa3df','#3a5fd0','#a88be0','#e08fd0','#f3f0e6','#8a8f96','#2a2a33'];
function canPaint(id){ return CARDS[id] && CARDS[id].type==='monster' && !CARDS[id].token; }
function paintUnlocked(id){ return (SV.paintUnlocked||[]).includes(id); }
function painted(id){ const p=SV.paint&&SV.paint[id]; return !!(p && Object.keys(p).length); }
const hex6=n=>'#'+n.toString(16).padStart(6,'0');

// モデルの色を「見た目の面積が大きい順」にメイン・サブ・アクセントへ振り分ける
// 目や光る部分は除く。ただし光る部分しかないモンスターは、光る部分も塗れるようにする
function partArea(o){
  const p=(o.geometry&&o.geometry.parameters)||{}, sc=((o.scale.x+o.scale.y+o.scale.z)/3)**2;
  let a=.4;
  if(p.tube!=null) a=p.radius*p.tube*20;
  else if(p.radiusTop!=null) a=(p.radiusTop+p.radiusBottom)*p.height*1.5;
  else if(p.width!=null && p.depth!=null) a=2*(p.width*p.height+p.height*p.depth+p.width*p.depth);
  else if(p.radius!=null && p.height!=null) a=p.radius*p.height*2;
  else if(p.radius!=null) a=p.radius*p.radius*4;
  return a*sc;
}
function paintRoles(model){
  if(model.userData.roles) return model.userData.roles;
  const normal=new Map(), glow=new Map();
  model.traverse(o=>{
    if(!o.isMesh) return;
    for(const mt of (Array.isArray(o.material)?o.material:[o.material])){
      if(!mt || !mt.color || !mt.isMeshStandardMaterial) continue;
      const k=mt.color.getHex(); if(k===0x111111 || k===0x000000) continue;
      const bucket=(mt.emissive && mt.emissive.getHex()!==0 && (mt.emissiveIntensity||0)>=0.9) ? glow : normal;
      if(!bucket.has(k)) bucket.set(k,{w:0,mats:[]});
      const g=bucket.get(k); g.w+=partArea(o); if(!g.mats.includes(mt)) g.mats.push(mt);
    }
  });
  const by=m=>[...m.entries()].sort((a,b)=>b[1].w-a[1].w);
  let list=by(normal);
  if(list.length<2) list=list.concat(by(glow).filter(([k])=>k!==0xffffff));
  const roles={}; PAINT_ROLES.forEach((r,i)=>{ if(list[i]) roles[r]={orig:list[i][0], mats:list[i][1].mats}; });
  model.userData.roles=roles; return roles;
}
function applyPaint(model,colors){
  const roles=paintRoles(model);
  for(const r of PAINT_ROLES){
    const R=roles[r]; if(!R) continue;
    const c=new THREE.Color(colors && colors[r] ? colors[r] : R.orig);
    R.mats.forEach(m=>{ m.color.copy(c); if(m.emissive && (m.emissiveIntensity||0)>0) m.emissive.copy(c); });
  }
}

// ----- ペイント画面 -----
let PV=null;
function openPaint(id){
  closeModal();
  PV={id, draft:{...((SV.paint||{})[id]||{})}};
  showModal(`<div class="paint" style="--el:${EL[CARDS[id].el]}">
    <div class="row between"><div><p class="eyebrow">${t('paint.title')}</p><h2>${esc(cardName(id))}</h2></div><span class="pts"><span class="lbl">${t('home.points')}</span><b class="num" id="paintPts">${SV.points}</b></span></div>
    <div class="paint-stage"><canvas id="paintCanvas" width="320" height="320" aria-label="${esc(cardName(id))}"></canvas><span class="meta paint-hint">${t('paint.drag')}</span></div>
    <div id="paintCtl"></div></div>`,'paint-modal');
  startPreview();
  renderPaintCtl();
}
function renderPaintCtl(){
  const box=$('#paintCtl'); if(!box || !PV) return;
  const id=PV.id, cost=PAINT_COST[CARDS[id].rarity], have=(SV.collection[id]||0)>0;
  const pts=$('#paintPts'); if(pts) pts.textContent=SV.points;
  if(!paintUnlocked(id)){
    box.innerHTML=`<p class="meta">${t('paint.lockedDesc')}</p>
      ${have?'':`<p class="warnc">${t('paint.needOwn')}</p>`}
      <div class="row"><button class="btn" data-act="paintUnlock" ${have&&SV.points>=cost?'':'disabled'}>${t('paint.unlock',{p:cost})}</button><button class="ghost-btn" data-act="paintClose">${t('close')}</button></div>`;
    return;
  }
  if(!PV.model && !PV.model0) PV.model0=buildMonster(id);
  const roles=paintRoles(PV.model||PV.model0);
  box.innerHTML=PAINT_ROLES.filter(r=>roles[r]).map(r=>{
    const cur=PV.draft[r] || hex6(roles[r].orig);
    return `<div class="prow"><span class="pswatch big" style="background:${cur}"></span><b>${t('paint.'+r)}</b>
      <div class="pal">${paletteNow().map(c=>`<button class="pswatch ${c===cur?'on':''}" style="background:${c}" data-act="paintPick" data-r="${r}" data-c="${c}" aria-label="${c}"></button>`).join('')}
      <label class="pswatch custom" title="${t('paint.custom')}"><input type="color" data-paint-role="${r}" value="${cur}" aria-label="${t('paint.custom')}">＋</label></div></div>`;
  }).join('')+`<div class="row"><button class="btn" data-act="paintSave">${t('paint.save')}</button><button class="ghost-btn" data-act="paintReset">${t('paint.reset')}</button><button class="ghost-btn" data-act="paintClose">${t('close')}</button></div>
    <p class="meta">${t('paint.note')}</p>`;
}
function paintPick(r,c){ if(!PV) return; PV.draft[r]=c; if(PV.model) applyPaint(PV.model,PV.draft); renderPaintCtl(); }
function paintUnlock(){
  const id=PV.id, cost=PAINT_COST[CARDS[id].rarity];
  if(!(SV.collection[id]>0) || SV.points<cost){ toast(t('craftNo')); return; }
  SV.points-=cost; SV.paintUnlocked=SV.paintUnlocked||[]; SV.paintUnlocked.push(id); save();
  toast(t('paint.unlocked')); flash(); renderPaintCtl(); renderApp(true);
}
function paintSave(){
  const id=PV.id; SV.paint=SV.paint||{};
  if(Object.keys(PV.draft).length) SV.paint[id]={...PV.draft}; else delete SV.paint[id];
  save(); toast(t('paint.saved')); const back=id; closeModal(); showCard(back); renderApp(true);
}
function paintReset(){ PV.draft={}; if(PV.model) applyPaint(PV.model,{}); renderPaintCtl(); }

// 回転する3Dプレビュー（ペイント画面だけで動く小さな描画）
function startPreview(){
  stopPreview();
  const cv=$('#paintCanvas'); if(!cv || !cv.getContext || typeof THREE==='undefined' || !PV) return;
  try{
    const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
    r.setPixelRatio(Math.min(2,window.devicePixelRatio||1)); r.setSize(320,320,false);
    const sc=new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xdfe8ff,0x2a1d10,.85));
    const dl=new THREE.DirectionalLight(0xffffff,.95); dl.position.set(3,5,4); sc.add(dl);
    const rim=new THREE.DirectionalLight(0xffe0a0,.4); rim.position.set(-3,2,-4); sc.add(rim);
    const model=buildMonster(PV.id), holder=new THREE.Group(); holder.add(model); sc.add(holder);
    const box=new THREE.Box3().setFromObject(model), size=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
    model.position.set(-ctr.x,-box.min.y,-ctr.z);
    const disk=new THREE.Mesh(new THREE.CircleGeometry(Math.max(size.x,size.z)*.85+.2,48), new THREE.MeshBasicMaterial({color:col(EL[CARDS[PV.id].el]),transparent:true,opacity:.28}));
    disk.rotation.x=-Math.PI/2; disk.position.y=.005; sc.add(disk);
    const cam=new THREE.PerspectiveCamera(32,1,.05,100), span=Math.max(size.x,size.y,size.z);
    cam.position.set(0,size.y*.55+span*.55,span*2.6); cam.lookAt(0,size.y*.45,0);
    applyPaint(model,PV.draft);
    PV.model=model; PV.r=r;
    let drag=null, rotY=-.5, last=performance.now();
    cv.onpointerdown=e=>{ drag=e.clientX; try{ cv.setPointerCapture(e.pointerId); }catch(_){} };
    cv.onpointermove=e=>{ if(drag==null) return; rotY+=(e.clientX-drag)*.012; drag=e.clientX; };
    cv.onpointerup=cv.onpointercancel=()=>{ drag=null; };
    const loop=()=>{
      if(!PV || PV.r!==r) return;
      const now=performance.now(), dt=Math.min(.05,(now-last)/1000), tm=now/1000; last=now;
      if(drag==null) rotY+=dt*.55;
      holder.rotation.y=rotY; holder.position.y=Math.sin(tm*2)*.03*span;
      const ws=model.userData.wings; if(ws) for(const w of ws) w.rotation.z=w.userData.side*(.35+Math.sin(tm*(model.userData.flap||3))*.4);
      r.render(sc,cam); PV.raf=requestAnimationFrame(loop);
    };
    loop();
  }catch(e){ PV.model=null; }
}
function stopPreview(){
  if(PV && PV.r){ cancelAnimationFrame(PV.raf); try{ PV.r.dispose(); PV.r.forceContextLoss && PV.r.forceContextLoss(); }catch(e){} PV.r=null; }
}
