<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PROJECT GATE 3D</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b10">
<meta name="description" content="PROJECT GATE — 3D card battle game by AMITOA. Play in your browser, on your phone, or in VR/MR.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GATE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 全画面の3D卓。上に相手HUD、下に自分HUDと手札。暗い闘技場で統一した単一テーマ */
:root{
  --bg:#070b10; --panel:rgba(16,26,28,.86); --panel-solid:#14211f; --line:#2f4741;
  --fg:#eaf1ec; --muted:#93a8a1; --gate:#d9b45f; --danger:#ff6a55; --good:#5fcf95;
  --fire:#e5583c; --earth:#b08f5e; --bolt:#ecc943; --heal:#57c08a; --field:#45b0ad; --wind:#7fd0e8; --seal:#a88be0; --lore:#5f9cff; --ward:#f2e2a8; --shade:#7d8fd6; --nature:#6cbf4a; --iron:#9aa4ad; --water:#4aa3df; --dream:#e08fd0; --ice:#9fe3f0; --blood:#d0405a;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --cw:clamp(58px,15vw,96px);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gate);outline-offset:3px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:manipulation}

.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
.hud > *{pointer-events:auto}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none}
.hud-top > *{pointer-events:auto}
.brand{font-family:var(--f-display);color:var(--gate);letter-spacing:.08em;font-size:15px;align-self:center}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:12px}
.tool:hover{color:var(--fg)}
.tool.xr{color:#111;background:var(--gate);border-color:var(--gate);font-weight:700}

.pp{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:left;backdrop-filter:blur(4px)}
button.pp{cursor:default}
.pp.active{border-color:color-mix(in oklab,var(--gate) 60%,var(--line))}
.pp.target{cursor:pointer;border-color:var(--danger);animation:pulse 1.1s ease-in-out infinite}
.pp.hit{animation:shake .35s ease}
.who{font-family:var(--f-display);font-size:15px;letter-spacing:.05em}
.pips{display:inline-flex;align-items:center;gap:4px}
.pip{width:10px;height:10px;border-radius:50%;background:#22362f;border:1px solid var(--line)}
.pip.life.on{background:var(--danger);border-color:var(--danger)}
.pip.en{border-radius:2px;transform:rotate(45deg);width:8px;height:8px}
.pip.en.on{background:var(--gate);border-color:var(--gate)}
.num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;color:var(--muted);letter-spacing:.08em}
.meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fbadge{font-size:11px;color:var(--el);border:1px solid color-mix(in oklab,var(--el) 60%,transparent);border-radius:999px;padding:0 8px}

.logbox{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));width:250px;max-height:150px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;pointer-events:auto}
.logbox ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.logbox li{padding-left:8px;border-left:3px solid var(--line)}
.logbox li.p0{border-left-color:var(--gate)} .logbox li.p1{border-left-color:var(--danger)}
@media (max-width:700px){ .logbox{display:none} .logbox.open{display:block;top:auto;bottom:calc(var(--cw)*1.4 + 70px)} }

.hud-bottom{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bar .pp{flex:0 1 auto}
.hint{flex:1 1 180px;min-width:0;font-size:13px;color:var(--fg);text-shadow:0 1px 4px #000}
.hint.warn{color:var(--danger)}
.endbtn{background:var(--gate);color:#111;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;letter-spacing:.05em}
.endbtn:disabled{background:#22362f;color:var(--muted);cursor:not-allowed}
.hand{display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:10px 4px 2px;min-height:calc(var(--cw)*1.4 + 12px)}

.card{--el:var(--fire);position:relative;flex:0 0 auto;width:var(--cw);aspect-ratio:5/7;border-radius:8px;
  border:2px solid color-mix(in oklab,var(--el) 65%,var(--line));
  background:linear-gradient(165deg,color-mix(in oklab,var(--el) 40%,var(--panel-solid)) 0%,var(--panel-solid) 64%);
  display:grid;grid-template-rows:auto 1fr auto auto;padding:4px 5px 5px;text-align:left;cursor:pointer;overflow:hidden;
  transition:transform .15s ease,box-shadow .15s ease,opacity .15s}
.el-fire{--el:var(--fire)} .el-earth{--el:var(--earth)} .el-bolt{--el:var(--bolt)} .el-heal{--el:var(--heal)}
.el-field{--el:var(--field)} .el-wind{--el:var(--wind)} .el-seal{--el:var(--seal)} .el-lore{--el:var(--lore)} .el-ward{--el:var(--ward)} .el-shade{--el:var(--shade)} .el-nature{--el:var(--nature)} .el-iron{--el:var(--iron)} .el-water{--el:var(--water)} .el-dream{--el:var(--dream)} .el-ice{--el:var(--ice)} .el-blood{--el:var(--blood)}
.card .cost{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gate);color:var(--gate);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:11px}
.card .kind{justify-self:end;font-size:8.5px;color:var(--muted)}
.card .kind.tag{color:var(--el);font-weight:700}
.card .cost.down{border-color:var(--good);color:var(--good)}
.card .glyph{align-self:center;justify-self:center;font-family:var(--f-display);font-size:calc(var(--cw)*.36);line-height:1;color:var(--el)}
.card .name{font-weight:700;font-size:clamp(9.5px,2.4vw,12px);line-height:1.2}
.card .text{font-size:clamp(8px,2vw,10px);line-height:1.25;color:var(--muted);margin-top:2px}
.card .stats{display:flex;justify-content:space-between;font-family:var(--f-num);font-weight:700;font-size:clamp(10px,2.8vw,13px)}
.card .atk::before{content:"ATK ";font-size:.7em;color:var(--muted)}
.card .hp::before{content:"HP ";font-size:.7em;color:var(--muted)}
.card:hover{transform:translateY(-6px)}
.card.playable{box-shadow:0 0 0 2px var(--gate),0 0 14px color-mix(in oklab,var(--gate) 50%,transparent)}
.card.dim{opacity:.5}
.card.selected{transform:translateY(-12px);box-shadow:0 0 0 3px #fff,0 10px 24px rgba(0,0,0,.6)}

#cutin{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);pointer-events:none;z-index:15;opacity:0}
#cutin.show{animation:cut 1.15s ease forwards}
#cutin .cut{display:flex;flex-direction:column;align-items:center;gap:6px}
#cutin .cap{font-family:var(--f-display);font-size:18px;letter-spacing:.08em;text-shadow:0 2px 8px #000}
#cutin .foe .cap{color:var(--danger)} #cutin .me .cap{color:var(--gate)}
#cutin .card{--cw:clamp(110px,26vw,150px);box-shadow:0 0 40px color-mix(in oklab,var(--el) 70%,transparent)}
#banner{position:fixed;left:0;right:0;top:42%;text-align:center;pointer-events:none;z-index:16;opacity:0;font-family:var(--f-display);font-size:clamp(28px,7vw,52px);letter-spacing:.12em;text-shadow:0 0 24px currentColor}
#banner.show{animation:banner 1.3s ease forwards}
#banner.me{color:var(--gate)} #banner.foe{color:var(--danger)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:14}
#flash.go{animation:flash .45s ease-out}
#fx{position:fixed;inset:0;pointer-events:none;z-index:17}
.float{position:fixed;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:700;font-size:28px;text-shadow:0 2px 8px rgba(0,0,0,.9);animation:rise 1s ease-out forwards}
.float.dmg{color:var(--danger)} .float.heal{color:var(--good)} .float.info{color:var(--gate);font-family:var(--f-display);font-size:20px}

.modal{position:fixed;inset:0;z-index:30;background:rgba(5,8,10,.78);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto}
.sheet h2{margin:0 0 8px;font-family:var(--f-display);font-weight:400;color:var(--gate);font-size:20px}
.sheet ul{margin:8px 0;padding-left:1.2em;max-width:65ch}
.cardtable{overflow-x:auto}
.cardtable table{border-collapse:collapse;font-size:12.5px;min-width:480px}
.cardtable td,.cardtable th{border-bottom:1px solid var(--line);padding:4px 10px 4px 0;text-align:left}
.cardtable th{color:var(--muted);font-weight:400;font-size:11px}
.ov{background:var(--panel-solid);border:1px solid var(--gate);border-radius:14px;padding:24px 34px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.ov h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:52px;color:var(--gate);letter-spacing:.1em}
.ov p{margin:0;color:var(--muted)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);color:var(--gate);letter-spacing:.1em;z-index:40;background:var(--bg)}

@keyframes pulse{50%{filter:brightness(1.3)}}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-56px}}
@keyframes shake{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
@keyframes cut{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
@keyframes banner{0%{opacity:0;transform:scaleX(1.6)}20%{opacity:1;transform:scaleX(1)}75%{opacity:1}100%{opacity:0}}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
[hidden]{display:none!important}
.card .kind{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--cw) - 26px)}
.card .text{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* --- アプリ画面 --- */
#app{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(7,11,16,.55),rgba(7,11,16,.92) 40%)}
.app-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app-top .brand{font-size:17px}
.pts{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.app-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 24px}
.screen{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,16,18,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;cursor:pointer;font-size:11px;min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gate)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.panel h3,.screen h3{margin:6px 0 0;font-size:13px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.row.center,.center{justify-content:center;text-align:center}
.btn{background:var(--gate);color:#111;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;letter-spacing:.03em}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{background:#22362f;color:var(--muted);cursor:not-allowed}
.ghost-btn{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.ghost-btn:disabled{opacity:.45;cursor:not-allowed}
.danger-btn{background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:8px 14px;cursor:pointer;align-self:flex-start}
.badge{font-size:11px;color:#111;background:var(--gate);border-radius:999px;padding:1px 8px;font-weight:700}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:4px 0 0}
.okc{color:var(--good)} .warnc{color:var(--danger)}
.eyebrow{margin:0;font-family:var(--f-display);color:var(--gate);letter-spacing:.12em;font-size:14px}
input,select{font:inherit;color:var(--fg);background:#0c1416;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;flex:1}
input[type=range]{padding:0;flex:1;accent-color:var(--gate)}
.field{display:flex;flex-direction:column;gap:4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:#0c1416;border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start}
.seg button{background:none;border:0;color:var(--muted);border-radius:7px;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--gate);color:#111;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12px}
.chip.on{border-color:var(--gate);color:var(--gate)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:#0c1416;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.item .meta{word-break:break-all}

/* ホーム */
.home{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.hello{display:flex;align-items:baseline;gap:10px}
.hello b{font-family:var(--f-display);font-size:18px;font-weight:400}
.packzone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.pack-status{margin:0;font-weight:700;color:var(--muted)}
.pack-status.ok{color:var(--gate)}
.pack{--tear:0;--p1:#e5583c;--p2:#2a1d33;position:relative;width:min(54vw,210px);aspect-ratio:5/7.4;border-radius:14px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background:linear-gradient(160deg,var(--p1),var(--p2));box-shadow:0 22px 50px rgba(0,0,0,.55),inset 0 0 0 2px rgba(217,180,95,.65);overflow:hidden;transform:rotate(-2deg)}
.tod-morning{--p1:#f2a65a;--p2:#3b2a4a} .tod-day{--p1:#e5583c;--p2:#2a1d33} .tod-evening{--p1:#c2366a;--p2:#1e1430} .tod-night{--p1:#4a3fbf;--p2:#0d0f24}
.pack-foil{position:absolute;inset:0;background:linear-gradient(105deg,transparent calc(var(--shine) - 9%),rgba(255,255,255,.32) var(--shine),transparent calc(var(--shine) + 9%));mix-blend-mode:screen;pointer-events:none}
.pack-top{position:absolute;left:0;right:0;top:0;height:14%;background:rgba(0,0,0,.28);border-bottom:2px dashed rgba(217,180,95,.55);display:grid;place-items:center;transition:transform .35s ease}
.seal{width:34%;height:30%;border-radius:4px;background:linear-gradient(90deg,#b8923f,#f3d58a,#b8923f);transform:rotate(var(--seal))}
.pack-art{position:absolute;inset:18% 8% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.pack-logo{font-family:var(--f-display);font-size:clamp(30px,10vw,44px);letter-spacing:.12em;color:#fff3d4;text-shadow:0 0 18px rgba(255,210,120,.7)}
.pack-set{font-size:11px;letter-spacing:.14em;color:#f3d58a}
.pack-glyphs{font-family:var(--f-display);font-size:15px;letter-spacing:.3em;color:rgba(255,255,255,.55)}
.tearline{position:absolute;left:0;top:14%;height:3px;width:calc(var(--tear) * 100%);background:#fff3d4;box-shadow:0 0 12px #ffd36b}
.pack[class*="corner-"]::after{content:"";position:absolute;width:20px;height:20px;pointer-events:none}
.corner-0::after{display:none}
.corner-1::after{top:0;right:0;background:linear-gradient(225deg,var(--bg) 50%,rgba(255,255,255,.4) 50%)}
.corner-2::after{bottom:0;right:0;background:linear-gradient(315deg,var(--bg) 50%,rgba(255,255,255,.4) 50%)}
.corner-3::after{bottom:0;left:0;background:linear-gradient(45deg,var(--bg) 50%,rgba(255,255,255,.4) 50%)}
.corner-4::after{top:0;left:0;background:linear-gradient(135deg,var(--bg) 50%,rgba(255,255,255,.4) 50%)}
.pack.locked{filter:grayscale(.75) brightness(.55);cursor:default}
.pack.omen{animation:omen 2.6s ease-in-out infinite}
.pack.torn .pack-top{transform:translate(30%,-130%) rotate(-10deg)}
@keyframes omen{0%,100%{filter:none}50%{filter:brightness(1.1) drop-shadow(0 0 7px rgba(255,236,170,.5))}}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* パック開封 */
.sheet.pack-modal{max-width:760px;background:rgba(14,20,22,.97)}
.godline{text-align:center;font-family:var(--f-display);font-size:28px;color:#ffe08a;letter-spacing:.12em;margin:0 0 8px;text-shadow:0 0 22px rgba(255,210,100,.8)}
.reveal{--cw:clamp(76px,22vw,124px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.flip{width:var(--cw);aspect-ratio:5/7;background:none;border:0;padding:0;perspective:900px;cursor:pointer}
.flip-in{position:relative;display:block;width:100%;height:100%;transition:transform .55s ease;transform-style:preserve-3d}
.reveal.fast .flip-in{transition-duration:.3s} .reveal.slow .flip-in{transition-duration:.85s}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px}
.face.back{display:grid;place-items:center;background:linear-gradient(160deg,#2a1d33,#0d0f24);border:2px solid var(--gate);font-family:var(--f-display);color:var(--gate);letter-spacing:.1em}
.face.back em{position:absolute;bottom:8px;font-style:normal;color:#fff;font-size:20px}
.flip.last .face.back{border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.35)}
.face.front{transform:rotateY(180deg)}
.face.front .card{width:100%;height:100%}
.flip.r-U.on .face.front{box-shadow:0 0 16px rgba(190,215,255,.7)}
.flip.r-R.on .face.front{box-shadow:0 0 28px rgba(255,210,100,.95)}
.newb{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 5px}
.rar{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--gate);background:var(--bg);border-radius:6px;padding:0 5px;white-space:nowrap}

/* マイカード */
.grid{--cw:clamp(78px,24vw,104px);display:flex;flex-wrap:wrap;gap:16px 10px;justify-content:center}
.grid.sm{--cw:clamp(64px,19vw,84px)}
.cell{position:relative;background:none;border:0;padding:0;cursor:pointer;width:var(--cw)}
.cell .card{cursor:pointer}
.cell .cnt{position:absolute;top:-6px;right:-6px;background:#0c1416;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:0 6px;font-family:var(--f-num)}
.cell.unowned .card{filter:grayscale(1) brightness(.4)}
.cell.maxed .card{opacity:.4}
.cell.indeck .card{box-shadow:0 0 0 2px var(--gate)}
.cell-card{background:none;border:0;padding:0;cursor:pointer;display:block;width:100%}
.cell-card .card{cursor:pointer}
.cell .info{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:#0c1416;border:1px solid var(--gate);color:var(--gate);font-family:var(--f-num);font-weight:700;font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0}
.cell .info:hover{background:var(--gate);color:#111}
.dmain{display:flex;flex-direction:column;gap:2px;min-width:0;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer}
.dtext{font-size:12px;color:var(--muted);line-height:1.35}
.deckctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#0c1416;border:1px solid var(--gate);border-radius:10px;padding:8px 10px}
.deckctl .mini:disabled{opacity:.35;cursor:not-allowed}
.dlist{display:flex;flex-direction:column;gap:4px}
.drow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;background:#0c1416;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.drow .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.dname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--el)}
.mini{background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;width:28px;height:28px;cursor:pointer}
.detail{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.detail .card.big{--cw:150px;cursor:default}
.detail-body{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:6px}
.detail-body h2{margin:0;font-family:var(--f-display);font-weight:400;color:var(--gate)}
.detail-body p{margin:0}

/* バトル */
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mode-txt{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.mode-txt b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.04em}
.mode-txt p{margin:0}
.mode.off{opacity:.55}

/* 対戦中 */
#openInfo{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;max-width:min(46vw,280px)}
.oi-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oi-cols ol{margin:2px 0 0;padding-left:18px}
.oi-cols li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--el)}
.ov .row{justify-content:center}
.ov .gain{color:var(--gate);font-weight:700}
.rarc{color:var(--gate);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#14211f;border:1px solid var(--gate);color:var(--fg);border-radius:10px;padding:8px 14px;opacity:0;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{animation:toast 2.4s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
#modal{z-index:50}
/* ポルタ */
.toppills{display:flex;gap:6px;align-items:center}
.pts.porta{border-color:#5fd0ff}
.crystal{color:#5fd0ff;text-shadow:0 0 8px rgba(95,208,255,.8)}
.bundles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.bundle{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:#0c1416;border:1px solid var(--line);border-radius:12px;padding:16px 8px 10px;text-align:center}
.bundle .crystal{font-size:28px}
.bundle b{font-size:20px}
.bundle.best{border:2px solid #5fd0ff;box-shadow:0 0 18px rgba(95,208,255,.45);background:linear-gradient(180deg,rgba(95,208,255,.14),#0c1416 60%)}
.bonus{font-size:12px;font-weight:700;color:#111;background:var(--gate);border-radius:999px;padding:0 8px}
.bonus.dim{background:none;color:var(--muted)}
.ribbon{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:#111;background:#5fd0ff;border-radius:999px;padding:1px 10px;white-space:nowrap}
.dbl{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;color:#fff;background:var(--danger);border-radius:6px;padding:0 5px}
.offers{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.offer{position:relative;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;background:#0c1416;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.offer .meta{grid-column:1}
.offer button{grid-row:1/3;grid-column:2}
.offer.bestrow,.offer.starter{border:2px solid #5fd0ff;box-shadow:0 0 14px rgba(95,208,255,.35)}
.offer.starter{margin:14px 0 4px;background:linear-gradient(120deg,rgba(255,214,120,.18),#0c1416 60%);border-color:var(--gate)}
.offer .ribbon{left:16px;transform:none}
.passcard{background:linear-gradient(150deg,rgba(212,175,55,.22),#0c1416 55%);border:1px solid var(--gate);border-radius:14px;padding:16px;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.passcard.on{box-shadow:0 0 22px rgba(212,175,55,.45)}
.passprice{font-family:var(--f-display);font-size:30px;color:#ffe08a;font-weight:400}
.passlist{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.passbanner{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;text-align:left;background:linear-gradient(120deg,rgba(212,175,55,.28),var(--panel) 65%);border:1px solid var(--gate);border-radius:14px;padding:12px 14px;color:var(--fg);cursor:pointer}
.passbanner b{font-family:var(--f-display);font-weight:400;font-size:16px;color:#ffe08a}
.passbanner.on{animation:breathe 2.2s ease-in-out infinite}
.agebtn{cursor:pointer;color:var(--fg);text-align:left}
.avatar.f-portal{border:3px solid #5fd0ff;box-shadow:0 0 0 3px rgba(95,208,255,.3),0 0 24px rgba(95,208,255,.9)}
.avatar.f-dawn{border:3px solid #ffb07a;box-shadow:0 0 0 3px rgba(255,176,122,.3),0 0 20px rgba(255,200,140,.8)}
/* パラレル */
.flip.foil .face.front::after,.cv-card.foil::after,.cell.hasfoil .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,80,160,.0) 10%,rgba(255,120,200,.35) 30%,rgba(120,220,255,.4) 50%,rgba(255,236,150,.35) 70%,rgba(255,80,160,0) 90%);background-size:250% 250%;mix-blend-mode:screen;animation:holo 3s linear infinite}
@keyframes holo{from{background-position:0% 50%}to{background-position:250% 50%}}
.foilb{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.12em;color:#111;background:linear-gradient(90deg,#ff9ad6,#9fe3ff,#ffe08a);border-radius:6px;padding:0 6px;z-index:2}
.foilmark{position:absolute;bottom:-8px;right:-4px;font-size:10px;font-weight:700;color:#111;background:linear-gradient(90deg,#ff9ad6,#9fe3ff,#ffe08a);border-radius:6px;padding:0 5px}
.card{position:relative}

/* ペイント */
.sheet.paint-modal{max-width:560px}
.paint h2{margin:0;font-family:var(--f-display);font-weight:400;color:var(--fg)}
.paint-stage{position:relative;display:grid;place-items:center;margin:8px 0;border-radius:16px;background:radial-gradient(circle at 50% 60%,color-mix(in oklab,var(--el) 25%,#0c1416),#070b10 75%);border:1px solid var(--line)}
#paintCanvas{width:min(80vw,320px);height:min(80vw,320px);touch-action:none;cursor:grab}
.paint-hint{position:absolute;bottom:6px;right:10px}
#paintCtl{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:8px 10px}
.prow .pal{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pswatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0;position:relative;display:grid;place-items:center;color:#fff;font-weight:700}
.pswatch.big{width:26px;height:26px;cursor:default;border-color:var(--gate)}
.pswatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--gate)}
.pswatch.custom{background:conic-gradient(#ff6a55,#ffd36b,#6cbf4a,#4aa3df,#a88be0,#ff6a55);overflow:hidden}
.pswatch.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.paintbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.paintbtn{background:linear-gradient(90deg,#e5583c,#ffd36b,#6cbf4a,#4aa3df,#a88be0);color:#111}
.paintb{position:absolute;top:-6px;left:-6px;background:linear-gradient(135deg,#ff6a55,#a88be0);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 5px}

/* ショップ・分解 */
button.pts{color:var(--fg);cursor:pointer;font:inherit}
.gold{color:var(--gate)}
.craftbox{display:flex;flex-direction:column;gap:6px;background:#0c1416;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sheet.shop-modal{max-width:620px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#0c1416;border:1px solid var(--line);border-radius:12px;padding:12px 8px}
.shopitem.on{border-color:var(--gate);box-shadow:0 0 12px rgba(217,180,95,.4)}
.title-chip{font-size:12px;font-weight:700;color:#111;background:linear-gradient(90deg,#b8923f,#ffe08a);border-radius:999px;padding:3px 10px}
.gcst.big{font-size:22px}
.mini-back{width:46px;height:64px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-size:10px;color:var(--gate);background:linear-gradient(160deg,#2a1d33,#0d0f24);border:2px solid var(--gate)}
.avatar.f-flame{border-color:#ff7a3a;box-shadow:0 0 0 3px rgba(255,90,40,.35),0 0 18px rgba(255,120,40,.8)}
.avatar.f-ice{border-color:#9fe3f0;box-shadow:0 0 0 3px rgba(159,227,240,.35),0 0 18px rgba(159,227,240,.8)}
.avatar.f-forest{border-color:#6cbf4a;box-shadow:0 0 0 3px rgba(108,191,74,.35),0 0 18px rgba(108,191,74,.7)}
.avatar.f-gold{border:3px solid #ffd36b;box-shadow:0 0 0 3px #8a6e34,0 0 22px rgba(255,214,120,.9)}
.avatar.f-rainbow{border:3px solid transparent;background:radial-gradient(circle at 35% 30%,color-mix(in oklab,var(--ac) 35%,#0c1416),#0c1416 70%) padding-box,conic-gradient(#ff6a55,#ffd36b,#6cbf4a,#4aa3df,#a88be0,#ff6a55) border-box;animation:spinGlow 4s linear infinite}
@keyframes spinGlow{50%{filter:hue-rotate(60deg) brightness(1.15)}}
.face.back.b-night,.mini-back.b-night{background:radial-gradient(circle at 30% 20%,#3a4fb0 0,transparent 40%),linear-gradient(160deg,#0d1240,#03040d);border-color:#c8d2ff;color:#c8d2ff}
.face.back.b-ember,.mini-back.b-ember{background:radial-gradient(circle at 50% 110%,#ff7a3a 0,transparent 55%),linear-gradient(160deg,#3a1208,#100503);border-color:#ff9a50;color:#ffd36b}
.face.back.b-aurora,.mini-back.b-aurora{background:linear-gradient(160deg,#0b3a3a,#3a1a5a 50%,#0d2a4a);border-color:#9fe3f0;color:#fff3d4;position:relative;overflow:hidden}
.face.back.b-aurora::after,.mini-back.b-aurora::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(120,255,200,.35) 40%,rgba(200,120,255,.3) 60%,transparent 80%);animation:aurora 3s ease-in-out infinite}
@keyframes aurora{50%{transform:translateX(18%)}}

/* --- Ver.2.5 ホーム --- */
.pstrip{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--fg);cursor:pointer;text-align:left;width:100%}
.pstrip-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pstrip-main b{font-family:var(--f-display);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{--ac:#d9b45f;flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--ac);background:radial-gradient(circle at 35% 30%,color-mix(in oklab,var(--ac) 35%,#0c1416),#0c1416 70%);border:2px solid var(--ac);box-shadow:0 0 14px color-mix(in oklab,var(--ac) 45%,transparent)}
.avatar.lg{width:76px;height:76px;font-size:38px}
.xpbar,.mbar,.dexbar{display:block;height:6px;border-radius:999px;background:#0c1416;border:1px solid var(--line);overflow:hidden}
.xpbar i,.mbar i,.dexbar i{display:block;height:100%;background:linear-gradient(90deg,#b8923f,#ffe08a);border-radius:inherit;transition:width .6s ease}
.news{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.newscard{flex:0 0 min(78%,300px);scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:linear-gradient(135deg,color-mix(in oklab,var(--tc) 30%,var(--panel-solid)),var(--panel-solid) 70%);border:1px solid color-mix(in oklab,var(--tc) 55%,var(--line));border-radius:14px;padding:12px 14px;color:var(--fg);cursor:pointer;min-height:96px}
.newscard b{font-size:15px;line-height:1.35}
.tag-update{--tc:#d9b45f} .tag-event{--tc:#ff6a55} .tag-info{--tc:#45b0ad}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#111;background:var(--tc);border-radius:999px;padding:1px 9px}
.packhead{width:min(100%,320px)}
.pips3{display:flex;align-items:center;gap:6px}
.ppip{width:16px;height:22px;border-radius:4px;border:1.5px solid var(--gate);background:transparent}
.ppip.on{background:linear-gradient(160deg,#e5583c,#2a1d33);box-shadow:0 0 8px rgba(229,88,60,.6)}
.bonusb{font-size:12px;font-weight:700;color:#111;background:var(--gate);border-radius:999px;padding:0 7px}
.packcount{position:absolute;right:8px;bottom:8px;font-family:var(--f-num);font-weight:700;color:#fff3d4;background:rgba(0,0,0,.45);border-radius:999px;padding:0 8px;font-size:14px}
.btn.big{padding:13px 34px;font-size:16px;box-shadow:0 0 22px rgba(217,180,95,.45);animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 34px rgba(255,214,120,.8)}}
.gcrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.gcitem{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:#0c1416;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--fg);cursor:pointer;text-align:left}
.gcitem:hover{border-color:var(--gate)}
.gcmini{display:flex;gap:4px}
.mini-card{--el:var(--fire);width:24px;height:33px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-size:12px;color:var(--el);background:linear-gradient(160deg,color-mix(in oklab,var(--el) 35%,#14211f),#14211f);border:1px solid color-mix(in oklab,var(--el) 60%,transparent)}
.mini-card.r-R{box-shadow:0 0 6px rgba(255,210,100,.8)} .mini-card.r-L{box-shadow:0 0 9px rgba(255,236,170,1);border-color:#ffe08a}
.gccost{font-size:11px;color:var(--gate)}
.gcst{color:var(--gate);letter-spacing:2px}
.missions{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;background:#0c1416;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mrow.got{opacity:.55}
.mtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.eventcard{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;background:linear-gradient(120deg,rgba(255,106,85,.22),var(--panel) 60%);border:1px solid rgba(255,106,85,.5);border-radius:14px;padding:12px 14px;color:var(--fg);cursor:pointer}
.eventcard b{font-family:var(--f-display);font-weight:400;font-size:17px}
.eventcard .meta{grid-column:2/4}
.eventcard .badge{grid-row:1;grid-column:3}
button.stat{color:var(--fg);cursor:pointer;text-align:left}
.newslist{display:flex;flex-direction:column;gap:12px}
.newsitem{border-bottom:1px solid var(--line);padding-bottom:10px}
.newsitem h3{margin:6px 0 4px;color:var(--fg);font-size:16px}
.newsitem p{margin:0;color:var(--muted);max-width:65ch}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:12px 0}
.stamp{position:relative;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;background:#0c1416;border:1px solid var(--line);border-radius:10px;padding:10px 6px;min-height:78px;overflow:hidden}
.stamp b{font-size:12px}
.stamp.today{border-color:var(--gate);box-shadow:0 0 14px rgba(217,180,95,.5)}
.seal-mark{position:absolute;inset:auto 0 0;margin:auto;font-family:var(--f-display);font-size:13px;color:#e5583c;border:2px solid #e5583c;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;transform:rotate(-14deg);top:0;opacity:.85}
.stamp.today .seal-mark{animation:stampIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:scale(2.2) rotate(-14deg);opacity:0}}
.gain{color:var(--gate);font-weight:700}
.pcard{display:flex;gap:14px;align-items:center}
.pcard-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pcard-main h2{margin:0;font-family:var(--f-display);font-weight:400;color:var(--fg)}
.bio{margin:0;padding:10px 12px;background:#0c1416;border-radius:10px;border:1px solid var(--line);white-space:pre-wrap;max-width:65ch}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pstats div{background:#0c1416;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px}
.lvup{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:10px}
.lvnum{font-family:var(--f-display);font-size:64px;color:#ffe08a;text-shadow:0 0 30px rgba(255,214,120,.9);animation:lvpop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes lvpop{from{transform:scale(.3);opacity:0}}
.sheet.lvup-modal,.sheet.login-modal{max-width:520px}
textarea{font:inherit;color:var(--fg);background:#0c1416;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:70px;resize:vertical;width:100%}

/* ゲットチャレンジ */
.gc-head{font-weight:700;color:var(--gate);min-height:1.5em}
.gc-board.shuffle .flip{animation:gcshuffle 1s ease-in-out}

  'g.new':['新カード{n}種を各2枚プレゼントしました','You received 2 copies each of {n} new cards','已赠送{n}种新卡各2张','Recibiste 2 copias de {n} cartas nuevas','신규 카드 {n}종을 2장씩 선물했습니다','Você recebeu 2 cópias de {n} cartas novas',"आपको {n} नए कार्डों की 2-2 प्रतियाँ मिलीं","حصلت على نسختين من كل بطاقة من {n} بطاقات جديدة","Vous avez reçu 2 exemplaires de chacune des {n} nouvelles cartes","আপনি {n}টি নতুন কার্ডের প্রতিটির 2টি করে কপি পেয়েছেন","Вы получили по 2 копии {n} новых карт","Anda menerima masing-masing 2 salinan dari {n} kartu baru"],
  'r10':['挑発のモンスターがいる間、相手はそれ以外のモンスターを攻撃できない。幽体のモンスターは相手プレイヤーだけを攻撃でき、モンスターに防がれない。ATKが0のモンスターは攻撃できない。','While you have a Taunt monster, the opponent must attack it before your other monsters. Phantom monsters can only attack the opponent, and monsters can\'t block them. Monsters with 0 ATK can\'t attack.','有嘲讽怪兽时，对手不能攻击其他怪兽。幽体怪兽只能攻击对手，且不会被怪兽阻挡。ATK为0的怪兽无法攻击。','Mientras tengas un monstruo con Provocar, el rival debe atacarlo antes que a tus otros monstruos. Los Fantasmas solo atacan al rival y los monstruos no los bloquean. Los monstruos con 0 ATK no pueden atacar.','도발 몬스터가 있는 동안 상대는 다른 몬스터를 공격할 수 없다. 유령 몬스터는 상대 플레이어만 공격하며 몬스터에게 막히지 않는다. ATK 0 몬스터는 공격할 수 없다.','Enquanto houver um monstro com Provocar, o oponente deve atacá-lo antes dos outros. Fantasmas só atacam o oponente e monstros não os bloqueiam. Monstros com 0 ATK não podem atacar.',"जब तक आपके पास चुनौती वाला राक्षस है, विरोधी को आपके बाकी राक्षसों से पहले उस पर हमला करना होगा। प्रेत राक्षस केवल विरोधी पर हमला कर सकते हैं और उन्हें रोका नहीं जा सकता। ATK 0 वाले राक्षस हमला नहीं कर सकते।","ما دام لديك وحش استفزاز، يجب على الخصم مهاجمته قبل وحوشك الأخرى. وحوش الشبح تهاجم الخصم فقط ولا يمكن صدّها. الوحوش ذات ATK 0 لا تستطيع الهجوم.","Tant que vous avez un monstre avec Provocation, l'adversaire doit l'attaquer avant vos autres monstres. Les Fantômes ne peuvent attaquer que l'adversaire et ne peuvent pas être bloqués. Les monstres avec 0 ATK ne peuvent pas attaquer.","আপনার উসকানি দানব থাকলে, প্রতিপক্ষকে আপনার অন্য দানবদের আগে সেটিকে আক্রমণ করতে হবে। প্রেত দানবরা শুধু প্রতিপক্ষকে আক্রমণ করতে পারে এবং তাদের আটকানো যায় না। ATK 0 এমন দানব আক্রমণ করতে পারে না।","Пока у вас есть монстр с Провокацией, противник должен атаковать его раньше ваших других монстров. Фантомы могут атаковать только противника, и их нельзя блокировать. Монстры с ATK 0 не могут атаковать.","Selama Anda punya monster Provokasi, lawan harus menyerangnya sebelum monster Anda yang lain. Monster Hantu hanya bisa menyerang lawan dan tidak bisa dihadang. Monster dengan ATK 0 tidak bisa menyerang."],

  'gc.note':['オンライン対応までは、ゲーム内で作られたパックです。4枚のどれを選んでも当たる確率は同じです。◆◆◆以上を含むパックは消費2','Until online play arrives, these packs are generated in-game. Each of the 4 cards is equally likely. Packs with ◆◆◆ or better cost 2',"在支持联网之前，这些卡包由游戏内生成。4张中无论选哪张，抽中的概率都相同。含◆◆◆以上的卡包消耗2","Hasta que llegue el modo en línea, estos sobres se generan en el juego. Las 4 cartas tienen la misma probabilidad. Los sobres con ◆◆◆ o mejor cuestan 2","온라인 대응 전까지는 게임 안에서 만들어진 팩입니다. 4장 중 무엇을 골라도 당첨 확률은 같습니다. ◆◆◆ 이상이 포함된 팩은 2 소비","Até o modo online chegar, estes pacotes são gerados no jogo. As 4 cartas têm a mesma chance. Pacotes com ◆◆◆ ou melhor custam 2","ऑनलाइन सुविधा आने तक ये पैक खेल के भीतर बनाए जाते हैं। 4 में से कोई भी कार्ड चुनें, मिलने की संभावना समान है। ◆◆◆ या बेहतर वाले पैक की लागत 2 है","حتى يتوفر اللعب عبر الإنترنت، تُنشأ هذه الحزم داخل اللعبة. لكل بطاقة من البطاقات الأربع الفرصة نفسها. الحزم التي تحتوي على ◆◆◆ أو أفضل تكلّف 2","En attendant le mode en ligne, ces boosters sont générés dans le jeu. Les 4 cartes ont la même chance. Les boosters avec ◆◆◆ ou mieux coûtent 2","অনলাইন চালু না হওয়া পর্যন্ত এই প্যাকগুলো গেমের ভেতরেই তৈরি হয়। 4টির যেকোনোটি বাছলেও পাওয়ার সম্ভাবনা সমান। ◆◆◆ বা তার বেশি থাকা প্যাকের খরচ 2","Пока нет онлайн-режима, эти наборы создаются в игре. Все 4 карты выпадают с равным шансом. Наборы с ◆◆◆ или лучше стоят 2","Sampai mode online hadir, paket ini dibuat di dalam game. Keempat kartu berpeluang sama. Paket berisi ◆◆◆ atau lebih baik berbiaya 2"],

  'pay.ageDesc':['はじめての購入の前に、年齢を選んでください。18歳未満の方は保護者の同意を得てから購入してください','Before your first purchase, choose your age group. If you are under 18, get a parent’s permission first',"首次购买前，请选择你的年龄段。未满18岁的人请先征得监护人同意","Antes de tu primera compra, elige tu franja de edad. Si eres menor de 18, pide permiso a tus padres o tutores","첫 구매 전에 나이를 선택해 주세요. 18세 미만은 보호자의 동의를 받은 뒤 구매해 주세요","Antes da primeira compra, escolha sua faixa etária. Se tiver menos de 18 anos, peça permissão aos responsáveis","पहली खरीद से पहले अपना आयु वर्ग चुनें। 18 से कम उम्र है तो पहले माता-पिता की अनुमति लें","قبل أول عملية شراء، اختر فئتك العمرية. إن كان عمرك أقل من 18 عامًا فاحصل على إذن ولي أمرك أولًا","Avant votre premier achat, choisissez votre tranche d'âge. Si vous avez moins de 18 ans, demandez d'abord l'accord d'un parent","প্রথম কেনার আগে আপনার বয়সের গ্রুপ বাছুন। 18-এর কম হলে আগে অভিভাবকের অনুমতি নিন","Перед первой покупкой выберите возрастную группу. Если вам меньше 18, сначала получите разрешение родителей","Sebelum pembelian pertama, pilih kelompok usia Anda. Jika di bawah 18 tahun, minta izin orang tua terlebih dahulu"],

  'odds.same':['同じレア度の中では、どのカードも同じ確率です','Within a rarity, every card is equally likely','同一稀有度内每张卡概率相同','Dentro de una rareza, todas las cartas tienen la misma probabilidad','같은 등급 안에서는 모든 카드의 확률이 같습니다','Dentro de uma raridade, todas as cartas têm a mesma chance',"एक ही दुर्लभता में हर कार्ड की संभावना बराबर है","ضمن الندرة نفسها، لكل بطاقة الفرصة نفسها","Au sein d'une rareté, chaque carte a la même chance","একই বিরলতার মধ্যে প্রতিটি কার্ডের সম্ভাবনা সমান","Внутри одной редкости все карты выпадают с равным шансом","Dalam satu kelangkaan, setiap kartu berpeluang sama"],
  'odds.note':['確率は全員共通です。パックの見た目や開け方では変わりません','Rates are the same for everyone and don\'t change with the pack\'s look or how you open it','概率对所有人相同，不会因卡包外观或开法而改变','Las probabilidades son iguales para todos y no cambian con el aspecto del sobre ni con cómo lo abras','확률은 모두에게 같으며 팩의 모양이나 여는 방법으로 바뀌지 않습니다','As chances são iguais para todos e não mudam com a aparência do pacote ou como você o abre',"संभावनाएँ सबके लिए समान हैं और पैक के रूप या खोलने के तरीके से नहीं बदलतीं","النسب واحدة للجميع ولا تتغير بشكل الحزمة أو طريقة فتحها","Les taux sont les mêmes pour tous et ne dépendent ni de l'apparence du booster ni de la façon de l'ouvrir","সম্ভাবনা সবার জন্য একই, এবং প্যাকের চেহারা বা খোলার পদ্ধতিতে বদলায় না","Шансы одинаковы для всех и не зависят от вида набора или способа открытия","Peluang sama untuk semua orang dan tidak berubah karena tampilan paket atau cara membukanya"],
  'odds.pity':['パックポイントで好きなカードを作成できます（1パック{p}pt）','Use Pack Points to craft any card ({p} pts per pack)','可用卡包点数制作任意卡牌（每包{p}点）','Usa Puntos de sobre para crear cualquier carta ({p} por sobre)','팩 포인트로 원하는 카드를 제작할 수 있습니다 (팩당 {p}pt)','Use Pontos de pacote para criar qualquer carta ({p} por pacote)',"पैक पॉइंट से कोई भी कार्ड बनाएँ (प्रति पैक {p} पॉइंट)","استخدم نقاط الحزم لصنع أي بطاقة ({p} نقطة لكل حزمة)","Utilisez les Points de booster pour créer n'importe quelle carte ({p} pts par booster)","প্যাক পয়েন্ট দিয়ে যেকোনো কার্ড তৈরি করুন (প্রতি প্যাকে {p} পয়েন্ট)","Используйте очки наборов, чтобы создать любую карту ({p} оч. за набор)","Gunakan Poin Paket untuk membuat kartu apa pun ({p} poin per paket)"],

  'r1':['デッキ20枚、初期手札{h}枚、ライフ{l}で始まる。','Decks have 20 cards. You start with {h} cards in hand and {l} life.','卡组20张，起手{h}张手牌，生命{l}。','Los mazos tienen 20 cartas. Empiezas con {h} cartas en mano y {l} de vida.','덱 20장, 시작 패 {h}장, 라이프 {l}로 시작한다.','Decks têm 20 cartas. Comece com {h} cartas na mão e {l} de vida.',"डेक में 20 कार्ड होते हैं। आप हाथ में {h} कार्ड और {l} जीवन से शुरू करते हैं।","تتكوّن المجموعة من 20 بطاقة. تبدأ بـ{h} بطاقات في يدك و{l} حيوات.","Les decks comptent 20 cartes. Vous commencez avec {h} cartes en main et {l} vies.","ডেকে 20টি কার্ড থাকে। আপনি হাতে {h}টি কার্ড এবং {l} জীবন নিয়ে শুরু করেন।","В колоде 20 карт. Вы начинаете с {h} картами в руке и {l} жизнями.","Dek berisi 20 kartu. Anda mulai dengan {h} kartu di tangan dan {l} nyawa."],
  'r2':['エネルギーは最初のターン{e}、自分のターンごとに1ずつ増える（最大{m}）。毎ターン1枚引く（最初の先攻1ターン目は引かない）。','Energy starts at {e} on your first turn and grows by 1 each of your turns (max {m}). Draw 1 card each turn (the first player skips their first draw).','能量首回合为{e}，每个我方回合+1（最多{m}）。每回合抽1张（先攻第1回合不抽）。','La energía empieza en {e} y sube 1 por cada turno tuyo (máx. {m}). Robas 1 carta por turno (quien empieza no roba en su primer turno).','에너지는 첫 턴 {e}, 내 턴마다 1씩 늘어난다 (최대 {m}). 매 턴 1장 뽑는다 (선공 첫 턴 제외).','A energia começa em {e} e sobe 1 a cada turno seu (máx. {m}). Compre 1 carta por turno (quem começa não compra no 1º turno).',"पहले टर्न में ऊर्जा {e} से शुरू होती है और आपके हर टर्न में 1 बढ़ती है (अधिकतम {m})। हर टर्न 1 कार्ड लें (पहला खिलाड़ी अपने पहले टर्न में कार्ड नहीं लेता)।","تبدأ الطاقة بـ{e} في دورك الأول وتزيد 1 في كل دور لك (بحد أقصى {m}). اسحب بطاقة كل دور (لا يسحب اللاعب الأول في دوره الأول).","L'énergie commence à {e} à votre premier tour et augmente de 1 à chacun de vos tours (max {m}). Piochez 1 carte par tour (le premier joueur ne pioche pas à son premier tour).","প্রথম টার্নে শক্তি {e} থেকে শুরু হয় এবং আপনার প্রতি টার্নে 1 করে বাড়ে (সর্বোচ্চ {m})। প্রতি টার্নে 1টি কার্ড তুলুন (প্রথম খেলোয়াড় তার প্রথম টার্নে তোলে না)।","В первый ход у вас {e} энергии, и в каждый ваш ход она растёт на 1 (максимум {m}). Берите 1 карту каждый ход (первый игрок не берёт карту в свой первый ход).","Energi dimulai dari {e} di giliran pertama Anda dan bertambah 1 setiap giliran Anda (maks {m}). Ambil 1 kartu setiap giliran (pemain pertama tidak mengambil di giliran pertamanya)."],
  'r3':['カードはコスト分のエネルギーを払って出す。モンスターは場に3体まで。','Pay energy equal to a card\'s cost to play it. Up to 3 monsters on your field.','支付与费用相同的能量出牌。场上最多3只怪兽。','Paga energía igual al coste para jugar una carta. Hasta 3 monstruos en tu campo.','코스트만큼 에너지를 내고 카드를 낸다. 몬스터는 필드에 3체까지.','Pague energia igual ao custo para jogar. Até 3 monstros no seu campo.',"कार्ड खेलने के लिए उसकी लागत जितनी ऊर्जा दें। आपके क्षेत्र में अधिकतम 3 राक्षस।","ادفع طاقة تساوي تكلفة البطاقة للعبها. حتى 3 وحوش في ساحتك.","Payez l'énergie égale au coût d'une carte pour la jouer. Jusqu'à 3 monstres sur votre terrain.","কার্ড খেলতে তার খরচের সমান শক্তি দিন। আপনার ক্ষেত্রে সর্বোচ্চ 3টি দানব।","Чтобы сыграть карту, заплатите энергию, равную её стоимости. На вашем поле — до 3 монстров.","Bayar energi sebesar biaya kartu untuk memainkannya. Hingga 3 monster di medan Anda."],
  'r4':['出したターンのモンスターは攻撃できない（速攻は例外）。攻撃は1体につき1ターン1回。','Monsters can\'t attack the turn they are played (except Rush). Each monster attacks once per turn.','怪兽登场回合无法攻击（速攻除外）。每只怪兽每回合攻击1次。','Los monstruos no pueden atacar el turno en que entran (salvo Rápido). Cada uno ataca una vez por turno.','낸 턴의 몬스터는 공격할 수 없다 (속공 제외). 1체당 턴에 1회 공격.','Monstros não atacam no turno em que entram (exceto Investida). Cada um ataca uma vez por turno.',"राक्षस जिस टर्न में खेले जाएँ उसमें हमला नहीं कर सकते (धावा को छोड़कर)। हर राक्षस प्रति टर्न एक बार हमला करता है।","لا تستطيع الوحوش الهجوم في الدور الذي تُلعب فيه (باستثناء الاندفاع). يهاجم كل وحش مرة واحدة في الدور.","Les monstres ne peuvent pas attaquer le tour où ils sont joués (sauf Charge). Chaque monstre attaque une fois par tour.","যে টার্নে খেলা হয় সেই টার্নে দানব আক্রমণ করতে পারে না (ঝটিকা ছাড়া)। প্রতিটি দানব প্রতি টার্নে একবার আক্রমণ করে।","Монстры не могут атаковать в ход, когда сыграны (кроме Рывка). Каждый монстр атакует раз за ход.","Monster tidak bisa menyerang pada giliran saat dimainkan (kecuali Serbu). Setiap monster menyerang sekali per giliran."],
  'r5':['戦闘ではお互いのATK分のダメージを与え、HPが0になると破壊。','In combat, both monsters deal damage equal to their ATK. A monster at 0 HP is destroyed.','战斗中双方造成等同ATK的伤害，HP为0即被破坏。','En combate, ambos monstruos infligen daño igual a su ATK. Con 0 HP se destruye.','전투에서는 서로 ATK만큼 데미지를 주고, HP가 0이 되면 파괴된다.','Em combate, ambos causam dano igual ao ATK. Com 0 HP, o monstro é destruído.',"लड़ाई में दोनों राक्षस अपने ATK जितनी क्षति देते हैं। 0 HP वाला राक्षस नष्ट हो जाता है।","في القتال، يوقع كل وحش ضررًا يساوي ATK الخاص به. يُدمَّر الوحش عند 0 HP.","En combat, les deux monstres infligent des dégâts égaux à leur ATK. Un monstre à 0 PV est détruit.","লড়াইয়ে দুই দানবই নিজের ATK-এর সমান ক্ষতি দেয়। 0 HP হলে দানব ধ্বংস হয়।","В бою оба монстра наносят урон, равный своей ATK. Монстр с 0 HP уничтожается.","Dalam pertarungan, kedua monster memberi damage sebesar ATK-nya. Monster dengan 0 HP hancur."],
  'r6':['相手の場に攻撃できるモンスターがいる間は、相手を直接攻撃できない。','You can\'t attack the opponent directly while they have a monster you can attack.','对手场上有可攻击的怪兽时，无法直接攻击对手。','No puedes atacar al rival directamente mientras tenga un monstruo atacable.','상대 필드에 공격 가능한 몬스터가 있으면 직접 공격할 수 없다.','Não pode atacar o oponente diretamente enquanto ele tiver um monstro atacável.',"जब तक विरोधी के पास ऐसा राक्षस है जिस पर आप हमला कर सकते हैं, आप उस पर सीधा हमला नहीं कर सकते।","لا يمكنك مهاجمة الخصم مباشرة ما دام لديه وحش يمكنك مهاجمته.","Vous ne pouvez pas attaquer l'adversaire directement tant qu'il a un monstre que vous pouvez attaquer.","প্রতিপক্ষের আক্রমণযোগ্য দানব থাকলে তাকে সরাসরি আক্রমণ করা যায় না।","Нельзя атаковать противника напрямую, пока у него есть монстр, которого можно атаковать.","Anda tidak bisa menyerang lawan secara langsung selama ia punya monster yang bisa Anda serang."],
  'r7':['進化カードは、前のターンから場にいる進化元に重ねて出す。ダメージは引き継ぐ。','Evolution cards go on top of their base monster that has been in play since last turn. Damage carries over.','进化卡叠放在上回合起在场的进化源上，伤害会继承。','Las evoluciones se colocan sobre su monstruo base en juego desde el turno anterior. El daño se mantiene.','진화 카드는 이전 턴부터 필드에 있던 진화 전 몬스터 위에 겹쳐 낸다. 데미지는 이어진다.','Evoluções vão sobre o monstro base em jogo desde o turno anterior. O dano continua.',"विकास कार्ड उस मूल राक्षस के ऊपर रखे जाते हैं जो पिछले टर्न से मैदान में है। क्षति बनी रहती है।","توضع بطاقات التطوّر فوق وحشها الأساسي الموجود في اللعب منذ الدور السابق. يبقى الضرر.","Les cartes Évolution se posent sur leur monstre de base en jeu depuis le tour précédent. Les dégâts sont conservés.","বিবর্তন কার্ড আগের টার্ন থেকে মাঠে থাকা মূল দানবের উপর রাখা হয়। ক্ষতি থেকে যায়।","Карты эволюции кладутся на базового монстра, находящегося в игре с прошлого хода. Урон сохраняется.","Kartu evolusi ditumpuk di atas monster dasarnya yang sudah di medan sejak giliran lalu. Damage tetap terbawa."],
  'r8':['フィールドカードは1人1枚。別のフィールドを出すと張り替わる。','One Field card per player. Playing a different one replaces it.','每人限1张场地卡，打出其他场地卡会替换。','Un Campo por jugador. Jugar otro lo reemplaza.','필드 카드는 1인 1장. 다른 필드를 내면 교체된다.','Um Campo por jogador. Jogar outro o substitui.',"प्रति खिलाड़ी एक क्षेत्र कार्ड। दूसरा खेलने पर पहला बदल जाता है।","بطاقة ساحة واحدة لكل لاعب. لعب بطاقة أخرى يستبدلها.","Une carte Terrain par joueur. En jouer une autre la remplace.","প্রতি খেলোয়াড়ের একটি ক্ষেত্র কার্ড। অন্যটি খেললে আগেরটি বদলে যায়।","Одна карта Поля на игрока. Новая карта Поля заменяет прежнюю.","Satu kartu Medan per pemain. Memainkan kartu Medan lain akan menggantinya."],
  'r9':['山札が尽きて引けないと1ダメージ。相手のライフを0にしたら勝ち。','If you must draw from an empty deck, you take 1 damage. Reduce the opponent\'s life to 0 to win.','牌库耗尽无法抽牌时受到1点伤害。将对手生命降为0即可获胜。','Si debes robar de un mazo vacío, recibes 1 de daño. Gana dejando la vida del rival en 0.','덱이 비어 뽑을 수 없으면 1 데미지. 상대 라이프를 0으로 만들면 승리.','Se precisar comprar de um deck vazio, sofre 1 de dano. Zere a vida do oponente para vencer.',"खाली डेक से कार्ड लेना पड़े तो आपको 1 क्षति होती है। विरोधी का जीवन 0 करके जीतें।","إذا اضطررت للسحب من مجموعة فارغة، تتلقى 1 ضرر. اخفض حياة الخصم إلى 0 لتفوز.","Si vous devez piocher dans un deck vide, vous subissez 1 dégât. Réduisez la vie adverse à 0 pour gagner.","খালি ডেক থেকে কার্ড তুলতে হলে আপনি 1 ক্ষতি পান। প্রতিপক্ষের জীবন 0 করে জিতুন।","Если нужно взять карту из пустой колоды, вы получаете 1 урон. Снизьте жизнь противника до 0, чтобы победить.","Jika harus mengambil dari dek kosong, Anda menerima 1 damage. Kurangi nyawa lawan menjadi 0 untuk menang."],

  'acct.send':['ログイン用リンクを送る','Email me a login link','发送登录链接','Enviarme un enlace de acceso','로그인 링크 보내기','Enviar link de acesso','लॉगिन लिंक भेजें','أرسل لي رابط الدخول','M\'envoyer un lien de connexion','লগইন লিংক পাঠান','Прислать ссылку для входа','Kirim tautan masuk'],
  'acct.sent':['{e} にログイン用のリンクを送りました。メールを開いてリンクを押してください','We sent a login link to {e}. Open the email and tap the link','登录链接已发送至 {e}。请打开邮件并点击链接','Enviamos un enlace a {e}. Abre el correo y pulsa el enlace','{e}(으)로 로그인 링크를 보냈습니다. 메일을 열고 링크를 눌러 주세요','Enviamos um link para {e}. Abra o e-mail e toque no link','{e} पर लॉगिन लिंक भेजा गया है। ईमेल खोलकर लिंक पर टैप करें','أرسلنا رابط الدخول إلى {e}. افتح البريد واضغط على الرابط','Nous avons envoyé un lien à {e}. Ouvrez l\'e-mail et touchez le lien','{e}-এ লগইন লিংক পাঠানো হয়েছে। ইমেইল খুলে লিংকে ট্যাপ করুন','Мы отправили ссылку на {e}. Откройте письмо и нажмите на ссылку','Tautan masuk dikirim ke {e}. Buka email dan ketuk tautannya'],

function t(k,p){
  const a=STR[k]; let s = a ? (a[LI] ?? a[1]) : k;
  if(p) s=s.replace(/\{(\w+)\}/g,(_,n)=>resolveParam(p[n]));
  return s;
}
function resolveParam(v){
  if(typeof v==='string'){
    if(v[0]==='@') return cardName(v.slice(1));
    if(v[0]==='#') return who(+v.slice(1));
  }
  return v==null ? '' : v;
}
function cardName(id){ return NAME[id][LI]; }
function cardMotif(id){ return MOTIF[id][LI]; }
function who(pi){ return pi===0 ? t('you') : (S?.oppName || t('cpu')); }
function cardText(id){
  const d=CARDS[id], parts=[];
  if(d.evolveFrom) parts.push(t('txt.evolve',{c:'@'+d.evolveFrom}));
  if(d.rush) parts.push(t('txt.rush'));
  if(STR['txt.'+id]) parts.push(t('txt.'+id,{c:'@'+(d.ref||'drake')}));
  return parts.join(' ');
}
function setLang(code){
  const i=LANGS.findIndex(l=>l[0]===code); LI=i<0?1:i; LANG=LANGS[LI][0];
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : LANG;
  document.documentElement.dir = LANG==='ar' ? 'rtl' : 'ltr';
}

// Ver.2.2の新カードを、遊んでいた人にも新しく始めた人にも2枚ずつ配る（デッキ構築を試せるように）
function applyGifts(){
  SV.gifts=SV.gifts||[];
  if(SV.gifts.includes('v22') && SV.gifts.includes('v24')) return 0;
  let n=0;
  if(!SV.gifts.includes('v22')){ NEW_V22.forEach(id=>{ SV.collection[id]=Math.max(SV.collection[id]||0,2); }); SV.gifts.push('v22'); n+=NEW_V22.length; }
  if(!SV.gifts.includes('v24')){ NEW_V24.forEach(id=>{ SV.collection[id]=Math.max(SV.collection[id]||0,Math.min(2,cardLimit(id))); }); SV.gifts.push('v24'); n+=NEW_V24.length; }
  save(); return n;
}
function deckCount(c){ return Object.values(c||{}).reduce((s,n)=>s+(n||0),0); }
function deckName(i){ const d=SV.decks[i]; return d.name || (i===0 ? t('deck.starter') : t('deck.default',{n:i+1})); }

// デッキコード：GATE1- のあとにカードごとの枚数を並べた文字列
function deckCode(cards){ return 'GATE1-'+CARD_IDS.map(id=>Math.min(9,cards[id]||0)).join(''); }
// 古いコード（カードが少なかった頃）も読めるよう、足りない桁は0として扱う
function codeDigits(code){
  const m=String(code||'').trim().toUpperCase().match(/^GATE1-(\d+)$/);
  if(!m || m[1].length>CARD_IDS.length) return null;
  return m[1].padEnd(CARD_IDS.length,'0');
}
function parseCode(code){
  const dg=codeDigits(code); if(!dg) return null;
  const cards={}; CARD_IDS.forEach((id,i)=>{ const n=+dg[i]; if(n) cards[id]=Math.min(n,cardLimit(id)); });
  return deckCount(cards)===CONFIG.deckSize ? cards : null;
}

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms / CONFIG.animSpeed));
let S=null, uidSeq=0, gameSeq=0;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildDeck(counts){ const d=[]; for(const id of CARD_IDS) for(let k=0;k<(counts[id]||0);k++) d.push({uid:++uidSeq,id}); return shuffle(d); }
function newPlayer(counts){ const deck=buildDeck(counts); return { life:CONFIG.startLife, energy:0, deck, hand:deck.splice(0,CONFIG.handStart), field:Array(CONFIG.maxField).fill(null), fieldCard:null, grave:[], fogUntil:-1, turns:0, nextBonus:0 }; }
function atkOf(pi,m){ return m.atk + (S.p[pi].fieldCard==='altar' ? CONFIG.altarBonus : 0) + (m.id==='lastember' && S.p[pi].life<=2 ? 3 : 0); }
function addLog(pi,key,params){ S.log.unshift({pi,key,params}); if(S.log.length>80) S.log.pop(); }
function fx(key,text,cls){ S.fx.push([key,text,cls]); }
function evoTargets(pi,d){ return S.p[pi].field.filter(m=>m && m.id===d.evolveFrom && m.summonTurn<S.turnNo); }
function blockers(pi){ return S.p[pi].field.filter(m=>m && !m.guarded); }
function slotKey(pi,m){ return `s${pi}${S.p[pi].field.indexOf(m)}`; }
function alive(gid){ return !!S && S.gid===gid; }

function startMatch(mode, friendIdx){
  const my=SV.decks[SV.active].cards;
  if(deckCount(my)!==CONFIG.deckSize){ toast(t('deck.invalid',{m:CONFIG.deckSize})); APP.tab='cards'; APP.cardsSub='decks'; APP.editing=SV.active; showApp(true); return; }
  let opp={...STARTER}, oppName=null;
  if(mode!=='friend' && devOn()){ if(SV.dev.cpu==='mine') opp={...my}; else if(SV.dev.cpu==='random') opp=randDeck(); }
  if(mode==='friend'){
    const f=SV.friends[friendIdx]; if(!f){ toast(t('bt.noFriend')); return; }
    opp=parseCode(f.code)||opp; oppName=f.name;
  }
  S = { p:[newPlayer(my),newPlayer(opp)], turn:0, turnNo:0, sel:null, busy:false, over:false, overShown:false, winner:null,
        log:[], fx:[], hint:null, hintP:null, warn:false, gid:++gameSeq, mode, friendIdx, open:mode==='open', oppName };
  if(devOn() && SV.dev.hand.some(Boolean)) forceHand(S.p[0],SV.dev.hand.filter(Boolean).slice(0,CONFIG.maxHand));
  clearBoard3D();
  $('#overlay').hidden=true;
  showApp(false);
  const first = Math.random()<.5 ? 0 : 1;
  addLog(null,'l.start',{p:'#'+first});
  startTurn(first);
}
function toMenu(){
  if(renderer?.xr.isPresenting) renderer.xr.getSession()?.end();
  gameSeq++; S=null; clearBoard3D();
  $('#overlay').hidden=true;
