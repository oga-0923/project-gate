}

function energyFor(p){ return Math.min(CONFIG.energyMax, CONFIG.energyStart + p.turns - 1); }
function beginTurn(pi){
  S.turn=pi; S.turnNo++; S.sel=null; S.hint=null; S.warn=false;
  const p=S.p[pi];
  p.turns=(p.turns||0)+1;
  p.energy=energyFor(p)+(p.nextBonus||0); p.nextBonus=0;
  p.field.forEach((m,i)=>{
    if(!m) return;
    m.canAttack=!m.frozen && !(m.sleep>0);
    if(m.sleep>0) m.sleep--;
    if(m.id==='dongrim'){
      m.age=(m.age||0)+1;
      if(m.age>=3){
        const d=CARDS.elderoak;
        p.field[i]={ uid:++uidSeq, id:'elderoak', atk:d.atk, hp:d.hp, maxHp:d.hp, summonTurn:m.summonTurn, canAttack:!m.frozen, frozen:m.frozen, frozenSince:m.frozenSince, guarded:m.guarded, guardSince:m.guardSince, pierce:false, evolvedFrom:m.uid };
        addLog(pi,'l.grow',{a:'@dongrim',c:'@elderoak'});
        fx(`s${pi}${i}`,t('fx.grow'),'info');
      }
    }
  });
  if(p.fieldCard==='sanctuary'){
    p.field.forEach(m=>{ if(m && m.hp<m.maxHp){ const n=Math.min(CONFIG.sanctuaryHeal,m.maxHp-m.hp); m.hp+=n; fx(slotKey(pi,m),`+${n}`,'heal'); }});
  }
  if(S.turnNo>1) draw(pi);
}
function startTurn(pi){
  beginTurn(pi);
  showBanner(t(pi===0?'banner.you':'banner.opp'), pi===0?'me':'foe');
  render();
  if(!S.over && pi===1) cpuTurn(S.gid);
}
// ターン終了時の処理（ルーメンドの回復、封印・結界・抜け道の期限切れ）
function closeTurn(){
  const me=S.turn, p=S.p[me];
  const pray=p.field.filter(m=>m && m.id==='lumend').length;
  if(pray && p.life<CONFIG.maxLife){ const n=Math.min(pray,CONFIG.maxLife-p.life); p.life+=n; fx(`h${me}`,`+${n}`,'heal'); addLog(me,'l.heal',{p:'#'+me,n}); }
  p.field.forEach(m=>{ if(m){ if(m.frozen && m.frozenSince<S.turnNo) m.frozen=false; m.pierce=false; } });
  S.p[1-me].field.forEach(m=>{ if(m && m.guarded && m.guardSince<S.turnNo) m.guarded=false; });
}
function endTurn(){
  if(S.over) return;
  closeTurn();
  if(S.over){ render(); return; }
  startTurn(1-S.turn);
}

function draw(pi){
  const p=S.p[pi];
  if(!p.deck.length){ addLog(pi,'l.deckout',{p:'#'+pi,n:CONFIG.deckOutDamage}); damagePlayer(pi,CONFIG.deckOutDamage); return; }
  const c=p.deck.shift();
  if(p.hand.length>=CONFIG.maxHand){ addLog(pi,'l.burn',{c:'@'+c.id}); return; }
  p.hand.push(c);
}

function fogActive(pi){ return S.turnNo<=S.p[pi].fogUntil; }
function spellBonus(pi){ return S.p[pi].field.filter(m=>m && m.id==='kindlefox').length; }
function damagePlayer(pi,n){
  const p=S.p[pi];
  if(S.turn!==pi && fogActive(pi)){ fx(`h${pi}`,t('fx.fog'),'info'); addLog(pi,'l.fogBlock',{p:'#'+pi,n}); return; }
  p.life=Math.max(0,p.life-n);
  fx(`h${pi}`,`-${n}`,'dmg');
  if(p.life<=0 && !S.over){ S.over=true; S.winner=1-pi; addLog(1-pi,'l.win',{p:'#'+(1-pi)}); finishMatch(); }
}
function finishMatch(){
  if(S.sim) return;
  const win=S.winner===0;
  if(win){ SV.stats.w++; SV.points+=CONFIG.winPoints; SV.stats.streak=(SV.stats.streak||0)+1; SV.stats.best=Math.max(SV.stats.best||0,SV.stats.streak); }
  else { SV.stats.l++; SV.stats.streak=0; }
  mProgress('battle'); if(win) mProgress('win');
  addXP(win?25:15);
}
function damageMonster(owner,m,n){ m.hp-=n; fx(slotKey(owner,m),`-${n}`,'dmg'); killCheck(owner); }
// 場に出たときの共通処理（テラヴェル級の常時効果、ガイアルート）
function placeMonster(pi,i,obj){
  const p=S.p[pi]; p.field[i]=obj;
  if(p.fieldCard==='gaiaroot'){ obj.hp++; obj.maxHp++; }
  recalcStack(pi);
}
// スタックル：場の他のスタックル1体ごとに+1/+1
function recalcStack(pi){
  const st=S.p[pi].field.filter(m=>m && m.id==='stackle'), want=Math.max(0,st.length-1);
  st.forEach(m=>{ const delta=want-(m.sb||0); if(delta){ m.atk+=delta; m.hp+=delta; m.maxHp+=delta; m.sb=want; } });
}
function killCheck(pi){
  const p=S.p[pi]; let died=false;
  p.field.forEach((m,i)=>{
    if(!m || m.hp>0) return;
    died=true;
    p.field[i]=null; p.grave.push(m.id);
    addLog(pi,'l.destroyed',{p:'#'+pi,c:'@'+m.id});
    p.field.forEach(h=>{ if(h && h.id==='hollowshell' && h.hp>0) h.atk++; });
    if(m.id==='garakutan' && !S.over) draw(1-pi);
    if(m.id==='egg'){
      const k=p.deck.findIndex(c=>c.id==='drake');
      if(k>=0){
        const c=p.deck.splice(k,1)[0], d=CARDS.drake;
        placeMonster(pi,i,{ uid:c.uid, id:'drake', atk:d.atk, hp:d.hp, maxHp:d.hp, summonTurn:S.turnNo, canAttack:false, frozen:false, pierce:false });
        addLog(pi,'l.egg',{p:'#'+pi,c:'@drake'});
        fx(`s${pi}${i}`,t('fx.hatch'),'info');
      }
    }
  });
  if(died){ recalcStack(pi); if(p.field.some(m=>m && m.hp<=0)) killCheck(pi); }
}
function costOf(pi,c){ const d=CARDS[c.id]; return d.type==='magic' && S.p[pi].fieldCard==='storm' ? Math.max(1,d.cost-1) : d.cost; }
function pierceTargets(pi){ return S.p[pi].field.filter(m=>m && m.canAttack && m.atk<=2 && !CARDS[m.id].phantom); }
function allyTargets(pi,id){
  const f=S.p[pi].field.filter(Boolean);
  if(id==='pierce') return pierceTargets(pi);
  if(id==='galeslash') return f.filter(m=>m.summonTurn===S.turnNo && !m.canAttack && !m.frozen && !(m.sleep>0) && atkOf(pi,m)>0);
  return f;
}
const ALLY_CARDS=['guard','pierce','sacrivel','galeslash'];
const ENEMY_CARDS=['fireball','chain','undertow'];
function lulled(m){ return S.turnNo===S.lullTurn && !CARDS[m.id].phantom; }
function canAttackWith(pi,m){ return m.canAttack && atkOf(pi,m)>0 && !lulled(m); }

// 出せない理由を [文言キー, 値] で返す。出せるなら null
function canPlay(pi,c){
  const p=S.p[pi], d=CARDS[c.id], foes=S.p[1-pi].field.some(Boolean);
  if(costOf(pi,c)>p.energy) return ['w.energy'];
  if(d.evolveFrom) return evoTargets(pi,d).length ? null : ['w.evolve',{c:'@'+d.evolveFrom}];
  if(d.type==='monster' && !p.field.includes(null)) return ['w.full'];
  if(d.type==='field' && p.fieldCard===c.id) return ['w.fieldSame',{c:'@'+c.id}];
  if(c.id==='heal' && p.life>=CONFIG.maxLife) return ['w.lifeMax'];
  if(['chain','aoe','undertow','fizzlet'].includes(c.id) && !foes) return ['w.noEnemy'];
  if((c.id==='guard'||c.id==='sacrivel') && !p.field.some(Boolean)) return ['w.noAlly'];
  if(c.id==='book' && !p.deck.length) return ['w.noDeck'];
  if(c.id==='pierce' && !pierceTargets(pi).length) return ['w.pierce'];
  if(c.id==='galeslash' && !allyTargets(pi,'galeslash').length) return ['w.gale'];
  if(c.id==='revive' && !p.grave.length) return ['w.grave'];
  if(c.id==='fog' && p.fogUntil>S.turnNo) return ['w.fogOn'];
  return null;
}

function doPlay(pi,c,target){
  const p=S.p[pi], o=1-pi, d=CARDS[c.id];
  p.energy-=costOf(pi,c);
  p.hand.splice(p.hand.indexOf(c),1);
  if(d.type==='magic') p.field.forEach(m=>{ if(m && m.id==='echoling') m.atk++; });
  if(d.evolveFrom){
    const i=p.field.indexOf(target), dmg=target.maxHp-target.hp;
    p.field[i]={ uid:c.uid, id:c.id, atk:d.atk, hp:d.hp-dmg, maxHp:d.hp, summonTurn:target.summonTurn,
                 canAttack:target.canAttack, frozen:target.frozen, frozenSince:target.frozenSince,
                 guarded:target.guarded, guardSince:target.guardSince, pierce:target.pierce, evolvedFrom:target.uid };
    addLog(pi,'l.evolve',{p:'#'+pi,a:'@'+target.id,c:'@'+c.id});
    fx(`s${pi}${i}`,t('fx.evolve'),'info');
    if(c.id==='ignavault'){ S.p[o].field.forEach(m=>{ if(m){ m.hp-=1; fx(slotKey(o,m),'-1','dmg'); } }); killCheck(o); }
  } else if(d.type==='monster'){
    const i=p.field.indexOf(null);
    const m={ uid:c.uid, id:c.id, atk:d.atk, hp:d.hp, maxHp:d.hp, summonTurn:S.turnNo, canAttack:!!d.rush, frozen:false, pierce:false, sleep:c.id==='nemurin'?1:0 };
    if(c.id==='gamblet'){ m.atk=1+Math.floor(Math.random()*4); }
    if(c.id==='mimiq'){ const best=S.p[o].field.filter(Boolean).sort((a,b)=>atkOf(o,b)-atkOf(o,a))[0]; if(best){ m.atk=best.atk; m.hp=m.maxHp=best.maxHp; m.copied=best.id; } }
    placeMonster(pi,i,m);
    addLog(pi,'l.summon',{p:'#'+pi,c:'@'+c.id});
    if(c.id==='gamblet') addLog(pi,'l.gamble',{c:'@gamblet',n:m.atk});
    if(m.copied) addLog(pi,'l.mimic',{c:'@mimiq',t:'@'+m.copied});
    if(c.id==='aurelion') p.field.forEach(x=>{ if(x && x.hp<x.maxHp){ x.hp++; fx(slotKey(pi,x),'+1','heal'); } });
    if(c.id==='nyxhollow'){ S.p[0].fieldCard=null; S.p[1].fieldCard=null; addLog(pi,'l.nyx',{}); }
    if(c.id==='riddlewisp' && pi===0 && S.p[o].hand.length){ const h=S.p[o].hand[Math.floor(Math.random()*S.p[o].hand.length)]; addLog(0,'l.peek',{c:'@'+h.id}); }
  } else if(c.id==='fireball'){
    const dmg=d.dmg+spellBonus(pi);
    if(target==='face'){ addLog(pi,'l.hitFace',{p:'#'+pi,c:'@'+c.id,q:'#'+o}); damagePlayer(o,dmg); }
    else { addLog(pi,'l.hitMon',{p:'#'+pi,c:'@'+c.id,t:'@'+target.id}); damageMonster(o,target,dmg); }
  } else if(c.id==='fizzlet'){
    const dmg=1+spellBonus(pi), mine=p.field.filter(Boolean), foes=S.p[o].field.filter(Boolean);
    const back=mine.length && Math.random()<.5, side=back?pi:o, list=back?mine:foes, tg=list[Math.floor(Math.random()*list.length)];
    if(back) addLog(pi,'l.fizzle',{c:'@fizzlet'}); else addLog(pi,'l.hitMon',{p:'#'+pi,c:'@fizzlet',t:'@'+tg.id});
    damageMonster(side,tg,dmg);
  } else if(c.id==='heal'){
    p.life=Math.min(CONFIG.maxLife,p.life+d.amount);
    addLog(pi,'l.heal',{p:'#'+pi,n:d.amount});
    fx(`h${pi}`,`+${d.amount}`,'heal');
  } else if(c.id==='chain'){
    target.frozen=true; target.frozenSince=S.turnNo; target.canAttack=false;
    addLog(pi,'l.chain',{p:'#'+pi,t:'@'+target.id});
    fx(slotKey(o,target),t('fx.seal'),'info');
  } else if(c.id==='book'){
    const n=Math.min(d.draw,p.deck.length);
    for(let k=0;k<n;k++) draw(pi);
    addLog(pi,'l.draw',{p:'#'+pi,n});
    fx(`h${pi}`,`+${n}`,'info');
  } else if(c.id==='guard'){
    target.guarded=true; target.guardSince=S.turnNo;
    addLog(pi,'l.guard',{p:'#'+pi,t:'@'+target.id});
    fx(slotKey(pi,target),t('fx.guard'),'info');
  } else if(c.id==='aoe'){
    const dmg=1+spellBonus(pi);
    addLog(pi,'l.aoe',{p:'#'+pi,c:'@aoe'});
    S.p[o].field.forEach(m=>{ if(m){ m.hp-=dmg; fx(slotKey(o,m),`-${dmg}`,'dmg'); } });
    killCheck(o);
  } else if(c.id==='fog'){
    p.fogUntil=S.turnNo+1;
    addLog(pi,'l.fog',{p:'#'+pi,c:'@fog'});
    fx(`h${pi}`,t('fx.fogOn'),'info');
  } else if(c.id==='pierce'){
    target.pierce=true;
    addLog(pi,'l.pierce',{p:'#'+pi,t:'@'+target.id});
    fx(slotKey(pi,target),t('fx.pierce'),'info');
  } else if(c.id==='revive'){
    const id=p.grave.pop();
    if(p.hand.length<CONFIG.maxHand){ p.hand.push({uid:++uidSeq,id}); addLog(pi,'l.revive',{p:'#'+pi,c:'@'+id}); }
    else addLog(pi,'l.burn',{c:'@'+id});
    fx(`h${pi}`,'+1','info');
  } else if(c.id==='sacrivel'){
    addLog(pi,'l.sacrifice',{p:'#'+pi,c:'@'+target.id});
    target.hp=0; killCheck(pi);
    p.energy+=2; fx(`h${pi}`,'+2','info');
  } else if(c.id==='galeslash'){
    target.canAttack=true;
    addLog(pi,'l.gale',{t:'@'+target.id});
    fx(slotKey(pi,target),t('tag.rush'),'info');
  } else if(c.id==='tidecall'){
    p.nextBonus=(p.nextBonus||0)+2;
    addLog(pi,'l.tide',{p:'#'+pi});
    fx(`h${pi}`,'+2','info');
  } else if(c.id==='lullabam'){
    S.lullTurn=S.turnNo+1;
    addLog(pi,'l.lull',{});
    fx(`h${o}`,t('fx.lull'),'info');
  } else if(c.id==='undertow'){
    const i=S.p[o].field.indexOf(target);
    fx(`s${o}${i}`,t('fx.bounce'),'info');
    S.p[o].field[i]=null; recalcStack(o);
    if(S.p[o].hand.length<CONFIG.maxHand) S.p[o].hand.push({uid:++uidSeq,id:target.id});
    addLog(o,'l.bounce',{c:'@'+target.id});
  } else if(d.type==='field'){
    const old=p.fieldCard; p.fieldCard=c.id;
    if(old) addLog(pi,'l.fieldSwap',{p:'#'+pi,a:'@'+old,c:'@'+c.id});
    else addLog(pi,'l.field',{p:'#'+pi,c:'@'+c.id});
  }
}

// 攻撃のルール：挑発・幽体・抜け道・結界
function faceAllowed(pi,m){ const o=1-pi; return !CONFIG.mustAttackMonsters || !blockers(o).length || m.pierce || !!CARDS[m.id].phantom; }
function monTargetBlock(pi,m,tg){
  if(CARDS[m.id].phantom) return 'w.phantom';
  if(tg.guarded) return 'w.guarded';
  const taunts=blockers(1-pi).filter(e=>CARDS[e.id].taunt);
  if(taunts.length && !taunts.includes(tg)) return 'w.taunt';
  return null;
}

function attack(pi,m,target){
  const o=1-pi, a=atkOf(pi,m), mk=slotKey(pi,m);
  m.canAttack=false;
  if(target==='face'){
    addLog(pi,'l.face',{c:'@'+m.id,q:'#'+o,n:a});
    damagePlayer(o,a);
  } else {
    const tk=slotKey(o,target);
    let b=atkOf(o,target);
    if(target.id==='brambleback') b+=1;
    addLog(pi,'l.battle',{c:'@'+m.id,a,t:'@'+target.id,b});
    target.hp-=a; m.hp-=b;
    fx(tk,`-${a}`,'dmg'); if(b>0) fx(mk,`-${b}`,'dmg');
    if((target.id==='gloomcap' || target.id==='tundrak') && m.hp>0){ m.frozen=true; m.frozenSince=S.turnNo; }
    if(m.id==='tundrak' && target.hp>0){ target.frozen=true; target.frozenSince=S.turnNo; target.canAttack=false; }
    killCheck(o); killCheck(pi);
  }
}

/* ===== 演出つきの行動 ===== */
async function playAnimated(pi,c,target){
  const d=CARDS[c.id], o=1-pi;
  cutIn(pi,c.id);
  if(pi===1) await sleep(650);
  if(ENEMY_CARDS.includes(c.id)){
    const to = target==='face' ? CRYSTAL[o].clone() : slotPos(o,S.p[o].field.indexOf(target)).add(new THREE.Vector3(0,1,0));
    await projectile(CRYSTAL[pi].clone().add(new THREE.Vector3(0,.4,0)), to, EL[d.el]);
  }
  if(!S) return;
  const allyIdx = ALLY_CARDS.includes(c.id) && target ? S.p[pi].field.indexOf(target) : -1;
  const foes = c.id==='aoe' ? S.p[o].field.map((m,i)=>m?slotPos(o,i):null).filter(Boolean) : [];
  doPlay(pi,c,target);
  render();
  if(c.id==='heal') healFx(pi);
  if(c.id==='book') bookFx(pi);
  if(c.id==='revive') healFx(pi);
  if(c.id==='tidecall' || c.id==='lullabam'){ const p0=CRYSTAL[c.id==='tidecall'?pi:1-pi]; magicCircle(V(p0.x,.06,p0.z),EL[d.el],3,1.3); burst(p0,EL[d.el],60,2.5,1.2,.22,-1); }
  if(allyIdx>=0){ const p0=slotPos(pi,allyIdx); magicCircle(V(p0.x,.06,p0.z),EL[d.el],2.8,1.2); burst(V(p0.x,1,p0.z),EL[d.el],60,3,1,.2,-1); }
  if(c.id==='fog'){ const p0=CRYSTAL[pi]; magicCircle(V(p0.x,.06,p0.z),EL.ward,3.2,1.4); burst(p0,EL.ward,70,2,1.4,.24,-1); }
  if(c.id==='aoe'){ foes.forEach(p0=>{ pillar(p0,EL.bolt,7,.55,.32); burst(V(p0.x,1,p0.z),EL.bolt,40,5,.6,.22); }); shake(.4); flash(); }
  await sleep(d.type==='monster' ? 950 : 550);
}

async function attackAnimated(pi,m,target){
  const e=models.get(m.uid), o=1-pi;
  if(e){
    const from=e.root.position;
    const to = target==='face' ? CRYSTAL[o].clone() : slotPos(o,S.p[o].field.indexOf(target)).add(new THREE.Vector3(0,.8,0));
    const dir=to.clone().sub(from); dir.y=0; const len=dir.length(); dir.normalize();
    const back=dir.clone().multiplyScalar(-.35);
    const hit=dir.clone().multiplyScalar(Math.max(0,len-1.25)); hit.y=target==='face'?.7:.25;
    await tween(.18, k=>{ e.holder.position.copy(back).multiplyScalar(easeOut(k)); });
    await tween(.2, k=>{ e.holder.position.lerpVectors(back,hit,k*k); });
    if(!S) return;
    burst(to, EL[CARDS[m.id].el], 70, 6, .7, .24);
    burst(to, '#ffffff', 25, 4, .35, .3);
    shake(atkOf(pi,m)>=3 ? .45 : .25);
    if(atkOf(pi,m)>=3) flash();
    attack(pi,m,target);
    render();
    await tween(.35, k=>{ e.holder.position.copy(hit).multiplyScalar(1-easeOut(k)); });
  } else { attack(pi,m,target); render(); }
  await sleep(250);
}

/* ===== CPU（me=CPUが操作する側。テストでは両側をCPUにできる） ===== */
async function cpuTurn(gid){
  S.busy=true; render();
  await sleep(1100); if(!alive(gid)) return;
  for(let guard=0; guard<14 && !S.over; guard++){
    const pick=cpuPickPlay(1); if(!pick) break;
    await playAnimated(1,pick.card,pick.target); if(!alive(gid)) return;
    await sleep(CONFIG.cpuDelay); if(!alive(gid)) return;
  }
  for(const m of [...S.p[1].field]){
    if(S.over) break;
    if(!m || !canAttackWith(1,m) || !S.p[1].field.includes(m)) continue;
    const tg=cpuPickAttack(m,1); if(!tg) continue;
    await attackAnimated(1,m,tg); if(!alive(gid)) return;
    await sleep(CONFIG.cpuDelay); if(!alive(gid)) return;
  }
  S.busy=false;
  if(!S.over) endTurn(); else render();
}

function cpuPickPlay(me=1){
  const o=1-me, p=S.p[me], op=S.p[o];
  const ok = p.hand.filter(c=>!canPlay(me,c));
  const find = id => ok.find(c=>c.id===id);
  const enemies = op.field.filter(Boolean);
  const foeFog = fogActive(o);
  const fb = find('fireball');
  if(fb && !foeFog && op.life<=CARDS.fireball.dmg+spellBonus(me)) return {card:fb,target:'face'};
  const pc = find('pierce');
  if(pc && !foeFog){
    const cand=pierceTargets(me).sort((a,b)=>atkOf(me,b)-atkOf(me,a))[0];
    if(cand && blockers(o).length && atkOf(me,cand)>0) return {card:pc,target:cand};
  }
  const sc = find('sacrivel');
  if(sc){ const egg=p.field.find(m=>m && m.id==='egg'); if(egg && p.deck.some(c=>c.id==='drake')) return {card:sc,target:egg}; }
  const ev = ok.find(c=>CARDS[c.id].evolveFrom);
  if(ev) return {card:ev, target:evoTargets(me,CARDS[ev.id])[0]};
  const threatSum = enemies.filter(m=>!m.frozen && atkOf(o,m)>0).reduce((s,m)=>s+atkOf(o,m),0);
  const lb = find('lullabam');
  if(lb && threatSum>=p.life) return {card:lb};
  const fg = find('fog');
  if(fg && threatSum>0 && (threatSum>=p.life || p.life<=2)) return {card:fg};
  const ut = find('undertow');
  if(ut){ const big=enemies.filter(m=>CARDS[m.id].evolveFrom || atkOf(o,m)>=3 || CARDS[m.id].rarity==='L').sort((a,b)=>atkOf(o,b)-atkOf(o,a))[0]; if(big) return {card:ut,target:big}; }
  const ao = find('aoe');
  if(ao){ const kills=enemies.filter(m=>m.hp<=1+spellBonus(me)).length; if(kills>=1 || enemies.length>=2) return {card:ao}; }
  const gd = find('guard');
  if(gd){
    const danger = p.field.filter(m=>m && !m.guarded && (atkOf(me,m)>=3 || CARDS[m.id].evolveFrom) && enemies.some(e=>atkOf(o,e)>=m.hp));
    if(danger.length) return {card:gd,target:danger[0]};
  }
  const ch = find('chain');
  const threat = enemies.filter(m=>!m.frozen && atkOf(o,m)>=3).sort((a,b)=>atkOf(o,b)-atkOf(o,a))[0];
  if(ch && threat) return {card:ch,target:threat};
  if(!p.fieldCard && p.field.some(Boolean)){
    const bigMagic = p.hand.filter(c=>CARDS[c.id].type==='magic' && CARDS[c.id].cost>=2).length;
    const monsInHand = p.hand.filter(c=>CARDS[c.id].type==='monster').length;
    const damaged = p.field.some(m=>m && m.hp<m.maxHp);
    const f = (bigMagic>=2 && find('storm')) || (monsInHand>=2 && find('gaiaroot')) || (damaged ? (find('sanctuary')||find('altar')) : (find('altar')||find('sanctuary'))) || find('storm') || find('gaiaroot');
    if(f) return {card:f};
  }
  const mons = ok.filter(c=>CARDS[c.id].type==='monster' && !CARDS[c.id].evolveFrom).sort((a,b)=>CARDS[b.id].cost-CARDS[a.id].cost || (CARDS[b.id].atk||0)-(CARDS[a.id].atk||0));
  if(mons.length) return {card:mons[0]};
  const gs = find('galeslash');
  if(gs){ const tg=allyTargets(me,'galeslash').sort((a,b)=>atkOf(me,b)-atkOf(me,a))[0]; if(tg && atkOf(me,tg)>=2) return {card:gs,target:tg}; }
  if(fb && !foeFog){
    const killable = enemies.filter(m=>m.hp<=CARDS.fireball.dmg+spellBonus(me)).sort((a,b)=>atkOf(o,b)-atkOf(o,a));
    if(killable.length) return {card:fb,target:killable[0]};
    if(!enemies.length) return {card:fb,target:'face'};
  }
  const fz = find('fizzlet');
  if(fz && !p.field.some(Boolean)) return {card:fz};
  const tc = find('tidecall');
  if(tc && p.hand.some(c=>c!==tc && costOf(me,c)>energyFor(p)+0) ) return {card:tc};
  const rv = find('revive');
  if(rv && p.hand.length<=4) return {card:rv};
  const bk = find('book');
  if(bk && p.hand.length<=3) return {card:bk};
  const hl = find('heal'); if(hl) return {card:hl};
  return null;
}

function cpuPickAttack(m,me=1){
  const o=1-me, a=atkOf(me,m), foeFog=fogActive(o);
  if(a<=0 || lulled(m)) return null;
  if(CARDS[m.id].phantom || m.pierce) return foeFog ? null : 'face';
  let enemies=blockers(o);
  if(!enemies.length) return foeFog ? null : 'face';
  const taunts=enemies.filter(e=>CARDS[e.id].taunt);
  if(taunts.length) enemies=taunts;
  const back=e=>atkOf(o,e)+(e.id==='brambleback'?1:0);
  const opts = enemies.map(e=>({e, kill:e.hp<=a, die:m.hp<=back(e), eAtk:atkOf(o,e)})).sort((x,y)=>y.eAtk-x.eAtk);
  const best = opts.find(x=>x.kill && !x.die) || opts.find(x=>x.kill && x.eAtk>=a) || opts.find(x=>!x.die && x.e.id!=='gloomcap' && x.e.id!=='tundrak');
  if(best) return best.e;
  return CONFIG.mustAttackMonsters ? null : 'face';
}

/* ===== 対戦中のプレイヤー操作 ===== */
function setHint(key,params,warn){ if(!S) return; S.hint=key; S.hintP=params||null; S.warn=!!warn; }
async function run(fn){
  const gid=S.gid; S.busy=true; render();
  try{ await fn(); } finally { if(alive(gid)){ S.busy=false; render(); } }
}

function clickHand(c){
  if(S.sel?.card===c){ S.sel=null; return; }
  S.sel=null;
  const why=canPlay(0,c);
  if(why){ setHint(why[0],why[1],true); return; }
  setHint(null);
  const d=CARDS[c.id];
  if(d.evolveFrom){
    const ts=evoTargets(0,d);
    if(ts.length===1) run(()=>playAnimated(0,c,ts[0]));
    else S.sel={kind:'evolve',card:c};
    return;
  }
  if(ENEMY_CARDS.includes(c.id)){ S.sel={kind:'spell',card:c}; return; }
  if(ALLY_CARDS.includes(c.id)){
    const own=allyTargets(0,c.id);
    if(own.length===1) run(()=>playAnimated(0,c,own[0]));
    else S.sel={kind:'ally',card:c};
    return;
  }
  run(()=>playAnimated(0,c));
}

function resolveTarget(tg){
  const sel=S.sel; if(!sel) return;
  if(sel.kind==='attack'){
    if(tg==='face'){ if(!faceAllowed(0,sel.m)){ setHint('w.face',null,true); return; } }
    else { const w=monTargetBlock(0,sel.m,tg); if(w){ setHint(w,null,true); return; } }
    S.sel=null; setHint(null); run(()=>attackAnimated(0,sel.m,tg));
  } else if(sel.kind==='spell'){
    if(tg==='face' && sel.card.id!=='fireball'){ setHint('w.monOnly',{c:'@'+sel.card.id},true); return; }
    S.sel=null; setHint(null); run(()=>playAnimated(0,sel.card,tg));
  }
}

function heroIsTarget(){
  if(!S) return false;
  const sel=S.sel, myTurn=S.turn===0 && !S.over && !S.busy;
  return !!(myTurn && sel && ((sel.kind==='spell' && sel.card.id==='fireball') || (sel.kind==='attack' && faceAllowed(0,sel.m))));
}

function battleAct(act,data){
  if(act==='again'){ startMatch(S?.mode||'practice', S?.friendIdx); return; }
  if(act==='menu'){ toMenu(); return; }
  if(act==='vr'){ startXR('immersive-vr'); return; }
  if(act==='mr'){ startXR('immersive-ar'); return; }
  if(act==='view'){ SV.settings.view=(SV.settings.view+1)%VIEWS.length; viewIdx=SV.settings.view; save(); fitCamera(); applyI18n(); return; }
  if(act==='log'){ $('#logbox').classList.toggle('open'); return; }
  if(act==='rules'){ showRules(); return; }
  if(!S || S.over || S.busy || S.turn!==0) return;
  if(act==='end'){ S.sel=null; endTurn(); return; }
  if(act==='hand'){ const c=S.p[0].hand.find(c=>String(c.uid)===String(data.uid)); if(c) clickHand(c); }
  else if(act==='mon'){
    const pi=+data.pi, m=S.p[pi].field[+data.i];
    if(!m){ if(S.sel){ S.sel=null; setHint(null); } render(); return; }
    if(pi===0){
      if(S.sel?.kind==='evolve'){
        const sel=S.sel, d=CARDS[sel.card.id];
        if(evoTargets(0,d).includes(m)){ S.sel=null; setHint(null); run(()=>playAnimated(0,sel.card,m)); }
        else setHint('w.evolveTarget',{c:'@'+d.evolveFrom},true);
      }
      else if(S.sel?.kind==='ally'){ const sel=S.sel; if(!allyTargets(0,sel.card.id).includes(m)) setHint(sel.card.id==='pierce'?'w.pierceTarget':'w.allyTarget',null,true); else { S.sel=null; setHint(null); run(()=>playAnimated(0,sel.card,m)); } }
      else if(S.sel?.kind==='attack' && S.sel.m===m){ S.sel=null; setHint(null); }
      else if(m.canAttack && atkOf(0,m)<=0) setHint('w.noAtk',null,true);
      else if(m.canAttack && lulled(m)) setHint('w.lull',null,true);
      else if(m.sleep>0 || (!m.canAttack && m.id==='nemurin' && m.summonTurn>=S.turnNo-2)) setHint('w.sleep',null,true);
      else if(m.canAttack){ S.sel={kind:'attack',m}; setHint(null); }
      else setHint(m.frozen?'w.frozen':'w.tired',null,true);
    } else resolveTarget(m);
  }
  else if(act==='hero' && String(data.pi)==='1') resolveTarget('face');
  render();
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cardBody(id,cost){

  }).join('') || `<span class="meta">${t('hud.noHand')}</span>`;

    if(S.over) hint=t('h.over');

    else if(S.busy) hint='';
    else if(S.sel?.kind==='attack') hint=t('h.attack');
    else if(S.sel?.kind==='evolve') hint=t('h.evolve',{c:'@'+CARDS[S.sel.card.id].evolveFrom});
    else if(S.sel?.kind==='ally') hint=t(S.sel.card.id==='pierce'?'h.pierce':S.sel.card.id==='guard'?'h.ally':'h.allyGeneric');

  }
  const h=$('#hint'); h.textContent=`${t('hud.turn',{n:S.turnNo})}　${hint}`; h.classList.toggle('warn',S.warn);

  $('#log').innerHTML = S.log.map(l=>`<li class="${l.pi==null?'':'p'+l.pi}">${esc(t(l.key,l.params))}</li>`).join('');

  if(S.over && !S.overShown){
    S.overShown=true; const gid=S.gid;

    setTimeout(()=>{
      if(!alive(gid)) return;
      const ov=$('#overlay'), win=S.winner===0;
      ov.innerHTML=`<div class="ov"><p>${t('over.turns',{n:S.turnNo})}</p><h2>${t(win?'over.win':'over.lose')}</h2>${win?`<p class="gain">${t('pack.gotPoints',{n:CONFIG.winPoints})}</p>`:''}<p class="meta">EXP+${win?25:15}</p><div class="row"><button class="endbtn" data-act="again">${t('over.again')}</button><button class="ghost-btn" data-act="menu">${t('over.menu')}</button></div></div>`;
      ov.hidden=false;
    }, 1300);
  }
}

function cutIn(pi,id){
  const el=$('#cutin'), d=CARDS[id];
  const verb = d.type==='monster' ? (d.evolveFrom?t('cut.evolve'):t('cut.summon')) : (d.type==='field'?t('cut.field'):t('cut.cast'));
  el.innerHTML=`<div class="cut ${pi?'foe':'me'}"><span class="cap">${esc(who(pi))}　${verb}</span>${cardHTML(id)}</div>`;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');

function showBanner(text,cls){ const el=$('#banner'); el.textContent=text; el.className=cls; void el.offsetWidth; el.classList.add('show'); }
function flash(){ const f=$('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }

function flushFx(){
  if(renderer?.xr.isPresenting){
    for(const [k,tx,cls] of S.fx){ float3D(keyPos(k),tx,cls); if(cls==='dmg'){ if(k[0]==='h') crystalHit(+k[1]); else { const m=S.p[+k[1]].field[+k[2]]; const e=m&&models.get(m.uid); if(e) e.shakeT=.4; } } }
    S.fx=[]; return;
  }
  const layer=$('#fx'), W=innerWidth, H=innerHeight, bottomLimit=H-$('.hud-bottom').offsetHeight-30;
  for(const [k,tx,cls] of S.fx){
    const p=keyPos(k).project(camera);
    let x=(p.x+1)/2*W, y=(1-p.y)/2*H;
    x=Math.min(W-30,Math.max(30,x)); y=Math.min(bottomLimit,Math.max(70,y));
    const s=document.createElement('span');
    s.className='float '+cls; s.textContent=tx; s.style.left=x+'px'; s.style.top=y+'px';
    layer.append(s); setTimeout(()=>s.remove(),1050);
    if(cls==='dmg'){
      if(k[0]==='h'){ crystalHit(+k[1]); const panel=k[1]==='0'?$('#mePanel'):$('#enemyPanel'); panel.classList.remove('hit'); void panel.offsetWidth; panel.classList.add('hit'); }
      else { const m=S.p[+k[1]].field[+k[2]]; const e=m&&models.get(m.uid); if(e) e.shakeT=.4; }
    }
  }
  S.fx=[];
}

/* ----- パック（回復制：8時間で1つ回復、最大3つまでためられる） ----- */
function dayKey(d=new Date()){ const x=new Date(d.getTime()-CONFIG.dailyResetHour*3600e3); return `${x.getFullYear()}-${x.getMonth()+1}-${x.getDate()}`; }
function regen(o,max,min){
  const now=Date.now(), R=min*60e3;
  if(o.stock>=max){ o.t=now; return false; }
  const k=Math.floor((now-o.t)/R); if(k<=0) return false;
  o.stock=Math.min(max,o.stock+k); o.t = o.stock>=max ? now : o.t+k*R; return true;
}
function syncPacks(){ const c=regen(SV.pk,CONFIG.packStockMax,CONFIG.packRegenMin); if(c) save(); return c; }
function syncGC(){ const c=regen(SV.gc,CONFIG.gcMax,CONFIG.gcRegenMin); if(c) save(); return c; }
function canOpenPack(){ return SV.settings.test || SV.pk.stock+SV.pk.bonus>0; }
function msLeft(o,max,min){ return o.stock>=max ? 0 : Math.max(0,o.t+min*60e3-Date.now()); }
function fmtLeft(ms){ const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; }
function packTimerText(){ if(SV.settings.test) return t('home.test'); return SV.pk.stock>=CONFIG.packStockMax ? t('home.full') : t('home.next',{time:fmtLeft(msLeft(SV.pk,CONFIG.packStockMax,CONFIG.packRegenMin))}); }
function gcTimerText(){ return SV.gc.stock>=CONFIG.gcMax ? t('home.full') : t('gc.next',{time:fmtLeft(msLeft(SV.gc,CONFIG.gcMax,CONFIG.gcRegenMin))}); }
// レア度を抽選する。min を指定すると、そのレア度以上だけで確率を割り直す（確定枠）
function pickRarity(min){
  const rates=effRates(), order=['C','U','R','L'], allowed=min?order.slice(order.indexOf(min)):order;
  const tot=allowed.reduce((s,k)=>s+(rates[k]||0),0); let x=Math.random()*tot;
  for(const k of allowed){ x-=rates[k]||0; if(x<0) return k; } return allowed[allowed.length-1];
}
function rollRarity(){ return pickRarity(); }
// kind：'normal'（無料のパック）／'premium'（購入：4枚目は◆◆以上確定）／'premiumR'（11パック目：4枚目は◆◆◆以上確定）
function rollPack(kind='normal'){
  const god=Math.random()<effGod(), cards=[], foil=[];
  for(let i=0;i<CONFIG.packSize;i++){
    const last=i===CONFIG.packSize-1;
    const rar = god ? 'R' : pickRarity(last&&kind==='premium'?'U' : last&&kind==='premiumR'?'R' : null);
    const pool=CARD_IDS.filter(id=>CARDS[id].rarity===rar);
    cards.push(pool[Math.floor(Math.random()*pool.length)]);
    foil.push(Math.random()<CONFIG.foilRate);
  }
  return {god,cards,foil,kind};
}
// 中身は開ける前に決めて保存する（再読み込みで引き直せないように）
function ensurePending(){ if(!SV.pending || SV.pending.cards.length!==CONFIG.packSize || !SV.pending.foil){ SV.pending={...rollPack('normal'), seed:Math.floor(Math.random()*1e9)}; save(); } return SV.pending; }
function rng(seed){ let a=seed>>>0; return ()=>{ a=a+0x6D2B79F5|0; let x=Math.imul(a^a>>>15,1|a); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; }; }
function todName(){ const h=new Date().getHours(); return h<5?'night':h<10?'morning':h<16?'day':h<19?'evening':'night'; }
// 謎の仕掛け1〜4は見た目だけ。5（神パックの予兆）だけが中身と結びついている
function packLook(){ const p=ensurePending(), r=rng(p.seed); return { corner:Math.floor(r()*5), seal:((r()-.5)*16).toFixed(1), shine:Math.round(10+r()*80), tod:todName(), omen:p.god }; }

/* ----- レベル・称号 ----- */
function xpNeed(lv){ return 60+lv*20; }
function levelInfo(){ let lv=1, x=SV.xp||0; while(x>=xpNeed(lv)){ x-=xpNeed(lv); lv++; } return {lv, cur:x, need:xpNeed(lv)}; }
const TITLES=[1,5,10,15,20,30];
function titleOf(lv){ let k=1; for(const n of TITLES) if(lv>=n) k=n; return t('title.'+k); }
function addXP(n){
  const before=levelInfo().lv; SV.xp=(SV.xp||0)+n; const after=levelInfo().lv;
  if(after>before){ let pts=0; for(let l=before+1;l<=after;l++) pts+=10*l; SV.points+=pts; const pr=10*(after-before); SV.porta.free+=pr; APP.levelUp={lv:after,pts,porta:pr}; }
  save();
}

/* ----- デイリーミッション ----- */
const MISSIONS=[{k:'pack',n:2,xp:30,pts:5},{k:'battle',n:1,xp:30,pts:5},{k:'win',n:1,xp:40,pts:10},{k:'gc',n:1,xp:20,pts:5}];
function syncMissions(){ const d=dayKey(); if(SV.ms.day!==d){ SV.ms={day:d,prog:{},claimed:{},all:false}; save(); } }
function mProgress(k,n=1){ syncMissions(); SV.ms.prog[k]=(SV.ms.prog[k]||0)+n; save(); }
function claimMission(k){
  syncMissions(); const m=MISSIONS.find(x=>x.k===k); if(!m || SV.ms.claimed[k] || (SV.ms.prog[k]||0)<m.n) return;
  SV.ms.claimed[k]=true; SV.points+=m.pts; toast(t('home.claimedT',{x:m.xp,p:m.pts}));
  if(!SV.ms.all && MISSIONS.every(x=>SV.ms.claimed[x.k])){ SV.ms.all=true; SV.pk.bonus++; SV.porta.free+=10; setTimeout(()=>toast(t('home.allDone')),1300); }
  addXP(m.xp); renderApp(true);
}

/* ----- ログインボーナス（連続でなくても、ログインした日数で進む） ----- */
const LOGIN_REWARDS=[{pts:5},{pts:5},{pack:1},{pts:10},{gc:1},{pts:10},{pack:2,porta:30}];
function rewardText(r){ const a=[]; if(r.pack) a.push(t('rw.pack',{n:r.pack})); if(r.gc) a.push(t('rw.gc',{n:r.gc})); if(r.pts) a.push(t('rw.pts',{n:r.pts})); if(r.porta) a.push(t('rw.porta',{n:r.porta})); return a.join('・'); }
function checkLogin(){
  const d=dayKey(); if(SV.login.day===d) return -1;
  SV.login.day=d; SV.login.count++;
  const idx=(SV.login.count-1)%LOGIN_REWARDS.length, r=LOGIN_REWARDS[idx];
  if(r.pts) SV.points+=r.pts; if(r.pack) SV.pk.bonus+=r.pack; if(r.gc) SV.gc.stock+=r.gc; if(r.porta) SV.porta.free+=r.porta;
  addChallenge(); addChallenge(); save(); return idx;
}
function showLogin(idx){
  showModal(`<h2 class="center">${t('login.title')}</h2><p class="meta center">${t('login.note')}</p>
    <div class="stamps">${LOGIN_REWARDS.map((r,i)=>`<div class="stamp ${i<idx?'done':''} ${i===idx?'today':''}"><span class="lbl">${t('login.day',{n:i+1})}</span><b>${rewardText(r)}</b>${i<=idx?'<span class="seal-mark">GATE</span>':''}</div>`).join('')}</div>
    <p class="center gain">${t('login.got')}：${rewardText(LOGIN_REWARDS[idx])}</p>
    <p class="center"><button class="btn" data-act="closeModal">OK</button></p>`,'login-modal');
}

/* ----- ゲットチャレンジ ----- */
function addChallenge(){
  const f=SV.friends.length ? SV.friends[Math.floor(Math.random()*SV.friends.length)].name : null;
  SV.gc.list.unshift({id:randId(), who:f, cards:rollPack().cards, at:Date.now()});
  SV.gc.list=SV.gc.list.filter(c=>Date.now()-c.at<24*3600e3).slice(0,6);
}
function gcCost(ch){ return ch.cards.some(id=>CARDS[id].rarity==='R'||CARDS[id].rarity==='L') ? 2 : 1; }
let GC=null;
function startGC(id){
  syncGC(); const ch=SV.gc.list.find(c=>c.id===id); if(!ch) return;
  const cost=gcCost(ch); if(SV.gc.stock<cost && !SV.settings.test){ toast(t('gc.noStamina')); return; }
  if(!SV.settings.test){ if(SV.gc.stock>=CONFIG.gcMax) SV.gc.t=Date.now(); SV.gc.stock-=cost; }
  SV.gc.list=SV.gc.list.filter(c=>c.id!==id);
  const order=shuffle(ch.cards.map((_,i)=>i));
  GC={ch,order,phase:'show',picked:-1}; save(); renderGC(); renderApp(true);
  setTimeout(()=>{ if(GC && GC.phase==='show'){ GC.phase='shuffle'; renderGC(); setTimeout(()=>{ if(GC && GC.phase==='shuffle'){ GC.phase='pick'; renderGC(); } },1100); } },1800);
}
function pickGC(i){
  if(!GC || GC.phase!=='pick') return;
  GC.phase='done'; GC.picked=i;
  const id=GC.ch.cards[GC.order[i]], isNew=!SV.collection[id];
  SV.collection[id]=(SV.collection[id]||0)+1;
  mProgress('gc'); addXP(5); save();
  renderGC(isNew);
  if(CARDS[id].rarity==='R'||CARDS[id].rarity==='L') flash();
}
function renderGC(isNew){
  const G=GC, who=G.ch.who || t('gc.keeper');
  const head = G.phase==='show' ? t('gc.memorize') : G.phase==='done' ? t('gc.got',{c:'@'+G.ch.cards[G.order[G.picked]]}) : t('gc.pick');
  const cells = G.phase==='show'
    ? G.ch.cards.map(id=>`<div class="flip on r-${CARDS[id].rarity}"><span class="flip-in"><span class="face back ${backCls()}"><span>GATE</span></span><span class="face front">${cardHTML(id)}</span></span></div>`).join('')
    : G.order.map((k,i)=>{ const id=G.ch.cards[k], open=G.phase==='done'; const mine=i===G.picked;
        return `<button class="flip gc-slot ${open?'on':''} ${mine?'mine':''} ${G.phase==='done'&&!mine?'other':''} r-${CARDS[id].rarity}" data-act="gcPick" data-i="${i}" style="--d:${i}" ${G.phase!=='pick'?'disabled':''}><span class="flip-in"><span class="face back ${backCls()}"><span>GATE</span></span><span class="face front">${cardHTML(id)}${mine&&isNew?'<span class="newb">NEW</span>':''}</span></span></button>`; }).join('');
  showModal(`<p class="eyebrow center">${t('gc.title')}</p><h2 class="center">${esc(t('gc.from',{p:who}))}</h2>
    <p class="center gc-head">${head}</p>
    <div class="reveal gc-board ${G.phase}">${cells}</div>
    ${G.phase==='done'?`<p class="center"><button class="btn" data-act="gcDone">${t('pack.done')}</button></p>`:''}
    <p class="note">${t('gc.note')}</p>`,'pack-modal');
}

function bindPackDrag(){
  const el=$('#pack'); if(!el || !el.classList || el.classList.contains('locked')) return;
  let st=null;
  el.addEventListener('pointerdown',e=>{ st={x:e.clientX,t:performance.now(),w:el.offsetWidth}; try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener('pointermove',e=>{
    if(!st) return;
    const dx=Math.abs(e.clientX-st.x), k=Math.min(1,dx/(st.w*.7));
    el.style.setProperty('--tear',k);
    if(k>=1){ const sp=dx/Math.max(1,performance.now()-st.t); st=null; el.classList.add('torn'); setTimeout(()=>openPack(sp),300); }
  });
  const stop=()=>{ if(st){ st=null; el.style.setProperty('--tear',0); } };
  el.addEventListener('pointerup',stop); el.addEventListener('pointercancel',stop);
}
function grantPack(pk){
  const before={...SV.collection}, seen={};
  pk.cards.forEach((id,i)=>{ SV.collection[id]=(SV.collection[id]||0)+1; if(pk.foil&&pk.foil[i]) SV.foil[id]=(SV.foil[id]||0)+1; });
  SV.points+=CONFIG.packPoints; SV.stats.packs=(SV.stats.packs||0)+1;
  addChallenge(); mProgress('pack'); addXP(10); save();
  return pk.cards.map(id=>{ const n=!before[id] && !seen[id]; seen[id]=true; return n; });
}
function showPack(pk,speed,queue){
  const isNew=grantPack(pk);
  PACK={ cards:pk.cards, foil:pk.foil||[], god:pk.god, kind:pk.kind||'normal', flipped:pk.cards.map(()=>false), fast:speed>1.2, isNew,
         queue:queue||[], total:(PACK&&PACK.queue&&PACK.total)||((queue||[]).length+1) };
  renderPackModal(); renderApp(true);
}
function openPack(speed){
  syncPacks();
  if(!canOpenPack()) return;
  const pk=ensurePending(); SV.pending=null;
  if(!SV.settings.test){ if(SV.pk.bonus>0) SV.pk.bonus--; else { if(SV.pk.stock>=CONFIG.packStockMax) SV.pk.t=Date.now(); SV.pk.stock--; } }
  PACK=null; showPack(pk,speed);
}
function renderPackModal(){
  const P=PACK, hide=SV.settings.hideLast, idx=P.total-P.queue.length;

    <div class="reveal ${P.fast?'fast':'slow'}">${P.cards.map((id,i)=>{
      const last=hide && i===P.cards.length-1, fo=P.foil[i];
      return `<button class="flip r-${CARDS[id].rarity} ${last?'last':''} ${fo?'foil':''}" data-act="flip" data-i="${i}" aria-label="${t('pack.tap')}"><span class="flip-in"><span class="face back ${backCls()}"><span>GATE</span>${last?'<em>?</em>':''}</span><span class="face front">${cardHTML(id)}${P.isNew[i]?'<span class="newb">NEW</span>':''}${fo?'<span class="foilb">PARALLEL</span>':''}<span class="rar">${RARITY[CARDS[id].rarity].mark}</span></span></span></button>`;
    }).join('')}</div>
    <p class="meta center">${t('pack.gotPoints',{n:CONFIG.packPoints})}・EXP+10</p>
    <div class="row center" id="packActions"><button class="ghost-btn" data-act="flipAll">${t('pack.flipAll')}</button></div>`,'pack-modal');

function flipCard(i,el){
  if(!PACK || PACK.flipped[i]) return;
  PACK.flipped[i]=true;
  const node=el||document.querySelector(`.flip[data-i="${i}"]`); node?.classList.add('on');
  const r=CARDS[PACK.cards[i]].rarity;
  if(r==='R' || PACK.foil[i]) flash();
  if(r==='L'){ flash(); node?.classList.add('legend'); setTimeout(flash,220); }
  if(PACK.flipped.every(Boolean)) $('#packActions').innerHTML = PACK.queue.length
    ? `<button class="btn" data-act="nextPack">${t('pack.next',{n:PACK.queue.length})}</button>`
    : `<button class="btn" data-act="collect">${t('pack.done')}</button>`;
}
function flipAll(){
  if(!PACK) return;
  const hide=SV.settings.hideLast, last=PACK.cards.length-1;
  PACK.cards.forEach((_,i)=>{ if(hide && i===last) return; setTimeout(()=>flipCard(i),i*160); });
}
function nextPack(){ if(!PACK || !PACK.queue.length) return; const q=PACK.queue.slice(1), nx=PACK.queue[0]; PACK.queue=q; showPack(nx,1,q); }

/* ----- パックポイントの使い道：作成・分解・ショップ ----- */
// 分解：上限（同名3枚、★は1枚など）を超えて持っている分だけポイントに戻せる。戻る量は作成コストの1/10
function dustOf(id){ return Math.round(RARITY[CARDS[id].rarity].craft/10); }
function extraOf(id){ return Math.max(0,(SV.collection[id]||0)-cardLimit(id)); }
function canCraft(id){ return !CARDS[id].token && (SV.collection[id]||0)<cardLimit(id); }
function craftCard(id){
  const c=RARITY[CARDS[id].rarity].craft;
  if(!canCraft(id)){ toast(t('craft.max')); return; }
  if(SV.points<c){ toast(t('craftNo')); return; }
  SV.points-=c; SV.collection[id]=(SV.collection[id]||0)+1; save(); toast(t('crafted'));
  if(CARDS[id].rarity==='R'||CARDS[id].rarity==='L') flash();
  showCard(id); renderApp(true);
}
function dismantle(id){
  const n=extraOf(id); if(!n) return;
  SV.collection[id]-=n; SV.points+=n*dustOf(id); save();
  toast(t('dust.done',{n,p:n*dustOf(id)})); showCard(id); renderApp(true);
}
function allExtras(){ return CARD_IDS.filter(id=>extraOf(id)>0).map(id=>({id,n:extraOf(id),p:extraOf(id)*dustOf(id)})); }
function showDustAll(){
  const ex=allExtras(), total=ex.reduce((s,x)=>s+x.p,0);
  showModal(`<h2>${t('dust.allTitle')}</h2><p class="meta">${t('dust.desc')}</p>
    ${ex.length?`<div class="dlist">${ex.map(x=>`<div class="drow"><span class="dot el-${CARDS[x.id].el}"></span><span class="dmain"><span class="dname">${esc(cardName(x.id))} <span class="meta">${RARITY[CARDS[x.id].rarity].mark}</span></span></span><b class="num">×${x.n}</b><b class="num gold">+${x.p}</b></div>`).join('')}</div>
    <p class="gain">${t('dust.total',{p:total})}</p>
    <p class="row"><button class="btn" data-act="dustAllGo">${t('dust.go')}</button><button class="ghost-btn" data-act="closeModal">${t('close')}</button></p>`
    :`<p>${t('dust.none')}</p><p class="row"><button class="ghost-btn" data-act="closeModal">${t('close')}</button></p>`}`);
}
function dustAll(){
  let p=0; for(const x of allExtras()){ SV.collection[x.id]-=x.n; p+=x.p; }

async function handleReturn(){
  let q; try{ q=new URLSearchParams(location.search); }catch(e){ return; }
  const c=q.get('checkout'); if(!c && !q.get('portal')) return;
  q.delete('checkout'); q.delete('portal');
  try{ history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash); }catch(e){}
  if(c!=='success' || !CU) return;
  let since=0, prod=''; try{ since=+sessionStorage.getItem('gate.co')||0; prod=sessionStorage.getItem('gate.coProd')||''; }catch(e){}
  toast(t('pay.pending'));
  for(let i=0;i<12;i++){
    await new Promise(r=>setTimeout(r,1500));
    try{
      const {data:rows}=await sb.from('purchases').select('id').gte('created_at',new Date(since-10*60e3).toISOString()).limit(1);
      await claimGrants(); await walletRefresh();
      const passOk = prod==='pass' && WALLET.w.pass_until && new Date(WALLET.w.pass_until).getTime()>Date.now();
      if((rows&&rows.length) || passOk){ toast(t('pay.done')); flash(); renderApp(true); if(!$('#modal').hidden) showPortaShop(); return; }
    }catch(e){}
  }
  renderApp(true);
}
async function callFn(name, body){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) throw new Error('login');
  const r=await fetch(CLOUD.url+'/functions/v1/'+name,{method:'POST',
    headers:{'Content-Type':'application/json', Authorization:'Bearer '+session.access_token, apikey:CLOUD.anon},
    body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) { const e=new Error(j.error||'server'); e.info=j; throw e; }
  return j;
}

  const cap=AGE_CAP[SV.pay.age], charge=opt.trial?0:prod.yen;
  if(spentThisMonth()+charge>cap){ toast(t('pay.cap',{n:cap.toLocaleString('ja-JP')})); return; }
  toast(t('pay.redirect'));
  try{

    if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; } await cloudPush();
    location.href=j.url;

    if(e.message==='cap') toast(t('pay.cap',{n:cap.toLocaleString('ja-JP')}));

// ----- ゲートパス（月額） -----
function dayNum(ts=Date.now()){ return Math.floor((ts - new Date(ts).getTimezoneOffset()*60e3 - CONFIG.dailyResetHour*3600e3)/864e5); }
function passActive(){ return (SV.pass.until||0)>Date.now(); }
function passDaysLeft(){ return Math.max(0,Math.ceil(((SV.pass.until||0)-Date.now())/864e5)); }
// ログインしなかった日の分も、最大7日分まで後からまとめて受け取れる
function syncPass(){
  const today=dayNum(); if(SV.pass.lastDay==null){ SV.pass.lastDay=today; return; }
  if(today<=SV.pass.lastDay) return;
  const upto=Math.min(today, dayNum(SV.pass.until||0)), add=Math.max(0, upto-SV.pass.lastDay);
  SV.pass.bank=Math.min(PASS.bankMax,(SV.pass.bank||0)+add); SV.pass.lastDay=today; save();
}
function startPass(days){ const base=passActive()?SV.pass.until:Date.now(); SV.pass.until=base+days*864e5; if(!SV.pass.bank) SV.pass.bank=1; SV.pass.lastDay=dayNum(); save(); }
function claimPass(){
  syncPass(); const n=SV.pass.bank||0; if(!n) return;
  SV.pk.bonus+=n*PASS.dailyPacks; SV.porta.free+=n*PASS.dailyPorta; SV.pass.bank=0; save();
  toast(t('pass.claimed',{n,p:n*PASS.dailyPorta})); flash(); renderApp(true);
}
function paletteNow(){ return passActive() ? [...PALETTE,...PASS_COLORS] : PALETTE; }

// ----- パックの直接購入と時短 -----
function buyPacks(n){
  const cost = n===1?PORTA_USE.pack1 : n===5?PORTA_USE.pack5 : PORTA_USE.pack11;
  if(!spendPorta(cost)){ toast(t('porta.short')); showPortaShop('buy'); return; }
  const count = n===11?11:n;
  const packs=Array.from({length:count},(_,i)=>rollPack(n===11 && i===count-1 ? 'premiumR' : 'premium'));
  closeModal(); showPack(packs[0],1,packs.slice(1));
}
function refillPack(){
  syncPacks();
  if(SV.pk.stock>=CONFIG.packStockMax){ toast(t('home.full')); return; }
  if(!spendPorta(PORTA_USE.refill)){ toast(t('porta.short')); showPortaShop('buy'); return; }
  SV.pk.stock++; save(); toast(t('porta.refilled')); closeModal(); renderApp(true);
}

// ----- ポルタショップ画面 -----
function bonusPct(x){ const base=PORTA_PACKS[0].p/PORTA_PACKS[0].yen; return Math.round((x.p/x.yen/base-1)*100); }
function showPortaShop(tab){
  tab=tab||APP.portaTab||'buy'; APP.portaTab=tab; syncPass(); syncPacks();
  const tabs=['buy','packs','pass'].map(k=>`<button class="${k===tab?'on':''}" data-act="portaTab" data-k="${k}">${t('porta.tab_'+k)}</button>`).join('');
  const buyBtn=(act,id,label)=>payEnabled() ? `<button class="btn sm" data-act="${act}" data-id="${id}">${label}</button>` : `<button class="btn sm" disabled>${label}</button>`;
  let body='';
  if(tab==='buy'){
    const starter = !SV.pay.bought.starter ? `<div class="offer starter"><span class="ribbon">${t('porta.once')}</span><b>${t('porta.starter')}</b><span class="meta">${t('porta.starterD',{n:STARTER_SET.packs,p:STARTER_SET.p})}</span>${buyBtn('buyStarter','starter',priceText(STARTER_SET))}</div>` : '';
    body=starter+`<div class="bundles">${PORTA_PACKS.map(x=>{ const first=!SV.pay.first[x.id], b=bonusPct(x);
      return `<div class="bundle ${x.best?'best':''}">${x.best?`<span class="ribbon">${t('porta.best')}</span>`:''}${first?`<span class="dbl">${t('porta.first2x')}</span>`:''}
        <span class="crystal">◆</span><b class="num">${(first?x.p*2:x.p).toLocaleString('ja-JP')}</b><span class="meta">${t('porta')}</span>
        ${b>0?`<span class="bonus">+${b}%</span>`:'<span class="bonus dim">—</span>'}${x.item?`<span class="meta gold">${t('porta.withFrame')}</span>`:''}
        ${buyBtn('buyPorta',x.id,priceText(x))}</div>`; }).join('')}</div>
      <p class="meta">${t('porta.bonusNote')}</p>`;
  } else if(tab==='packs'){
    const full=SV.pk.stock>=CONFIG.packStockMax;
    const row=(act,cost,title,desc,best,dis)=>`<div class="offer ${best?'bestrow':''}">${best?`<span class="ribbon">${t('porta.best')}</span>`:''}<b>${title}</b><span class="meta">${desc}</span><button class="btn sm" data-act="${act}" ${dis||portaTotal()<cost?'disabled':''}>${cost}${t('porta.unit')}</button></div>`;
    body=`<div class="offers">
      ${row('portaRefill',PORTA_USE.refill,t('porta.refill'),t('porta.refillD',{n:SV.pk.stock,m:CONFIG.packStockMax}),false,full)}
      ${row('portaPack1',PORTA_USE.pack1,t('porta.pack1'),t('porta.pack1D'))}
      ${row('portaPack5',PORTA_USE.pack5,t('porta.pack5'),t('porta.pack5D'))}
      ${row('portaPack11',PORTA_USE.pack11,t('porta.pack11'),t('porta.pack11D'),true)}
      ${row('portaGc',PORTA_USE.gc,t('shop.gc1'),t('shop.gc1d',{n:SV.gc.stock}))}
    </div><p class="row"><button class="ghost-btn" data-act="odds">${t('odds.title')}</button></p>`;
  } else {
    const act=passActive();
    body=`<div class="passcard ${act?'on':''}"><p class="eyebrow">${t('pass.name')}</p><b class="passprice">${priceText(PASS)}<span class="meta"> / ${t('pass.month')}</span></b>
      <ul class="passlist"><li>${t('pass.b1',{n:PASS.dailyPacks})}</li><li>${t('pass.b2',{n:PASS.dailyPorta})}</li><li>${t('pass.b3')}</li><li>${t('pass.b4',{n:PASS.bankMax})}</li></ul>
      <p class="meta">${t('pass.value',{n:PASS.days*PASS.dailyPacks,p:PASS.days*PASS.dailyPorta})}</p>
      ${act?`<p class="gain">${t('pass.active',{n:passDaysLeft()})}</p>${SV.pass.bank?`<button class="btn" data-act="passClaim">${t('pass.claim',{n:SV.pass.bank})}</button>`:`<p class="meta">${t('pass.claimedToday')}</p>`}`
        :`${!SV.pass.trialUsed?buyBtn('passTrial','trial',t('pass.trial',{n:PASS.trial})):''}${buyBtn('passBuy','pass',t('pass.buy',{p:priceText(PASS)}))}`}
      <p class="note">${cloudPay()?t('pass.noteWeb'):t('pass.note')}</p>${cloudPay()&&CU?`<button class="ghost-btn" data-act="payManage">${t('pay.manage')}</button>`:''}</div>`;
  }
  showModal(`<div class="row between"><h2>${t('porta.shop')}</h2><span class="pts porta"><span class="crystal">◆</span><b class="num">${portaTotal()}</b></span></div>
    <p class="meta">${t('porta.balance',{a:SV.porta.paid,b:SV.porta.free})}</p>
    ${cloudPay()&&!CU?`<div class="offer"><b>${t('acct.needLogin')}</b><button class="btn sm" data-act="acctLogin">${t('acct.login')}</button></div>`:''}
    <div class="seg wrap">${tabs}</div>${body}
    <p class="note">${cloudPay()?(CLOUD.testMode?t('pay.stripeTest'):''):payEnabled()?t('pay.testNote'):t('pay.soonNote')}${SV.pay.age&&SV.pay.age!=='adult'?'　'+t('pay.capNow',{a:spentThisMonth().toLocaleString('ja-JP'),b:AGE_CAP[SV.pay.age].toLocaleString('ja-JP')}):''}</p>
    <p class="row"><button class="ghost-btn" data-act="closeModal">${t('close')}</button></p>`,'shop-modal');
}
function portaAct(act,d){
  if(cloudAct(act,d)) return true;
  switch(act){
    case 'porta': showPortaShop(); return true;
    case 'portaTab': showPortaShop(d.k); return true;
    case 'buyPorta': { const x=PORTA_PACKS.find(p=>p.id===d.id); checkout(x,()=>{ const first=!SV.pay.first[x.id]; SV.porta.paid+=first?x.p*2:x.p; SV.pay.first[x.id]=true; if(x.item && !SV.shop.owned.includes(x.item)) SV.shop.owned.push(x.item); toast(t('porta.got',{n:first?x.p*2:x.p})); flash(); showPortaShop('buy'); }); return true; }
    case 'buyStarter': checkout(STARTER_SET,()=>{ SV.pay.bought.starter=true; SV.pk.bonus+=STARTER_SET.packs; SV.porta.paid+=STARTER_SET.p; if(!SV.shop.owned.includes(STARTER_SET.item)) SV.shop.owned.push(STARTER_SET.item); toast(t('porta.starterGot')); flash(); showPortaShop('buy'); }); return true;
    case 'passTrial': if(!payEnabled()){ toast(t('pay.soon')); return true; } SV.pass.trialUsed=true; startPass(PASS.trial); toast(t('pass.started')); flash(); showPortaShop('pass'); renderApp(true); return true;
    case 'passBuy': checkout(PASS,()=>{ startPass(PASS.days); toast(t('pass.started')); flash(); showPortaShop('pass'); }); return true;
    case 'passClaim': claimPass(); if(!$('#modal').hidden) showPortaShop('pass'); return true;
    case 'portaRefill': refillPack(); return true;
    case 'portaPack1': buyPacks(1); return true;
    case 'portaPack5': buyPacks(5); return true;
    case 'portaPack11': buyPacks(11); return true;
    case 'portaGc': if(!spendPorta(PORTA_USE.gc)){ toast(t('porta.short')); return true; } SV.gc.stock++; save(); toast(t('shop.bought',{x:t('shop.gc1')})); showPortaShop('packs'); renderApp(true); return true;
    case 'ageSet': { SV.pay.age=d.a; save(); const f=APP.pendingBuy; APP.pendingBuy=null; closeModal(); toast(t('pay.ageSaved')); if(f) showPortaShop(); return true; }
  }
  return false;
}

/* ----- 属性（テンプレデッキ・カード詳細で使う） ----- */
const ATTR={ fire:['fire','blood'], earth:['earth','iron','field'], sky:['bolt','wind'], water:['water','ice'], forest:['nature'], light:['heal','ward','lore'], shadow:['shade','dream','seal'] };
const ATTR_GLYPH={ fire:'火', earth:'地', sky:'天', water:'水', forest:'森', light:'光', shadow:'影' };
const ATTR_COLOR={ fire:'#e5583c', earth:'#b08f5e', sky:'#ecc943', water:'#4aa3df', forest:'#6cbf4a', light:'#f2e2a8', shadow:'#7d8fd6' };
function attrOf(id){ const el=CARDS[id].el; return Object.keys(ATTR).find(a=>ATTR[a].includes(el)); }
// テンプレの評価点（大量対戦の勝率と役割から決めた目安。高いほど優先して入れる）
const TSCORE={ drake:6, dragon:9, golem:6, knight:7, scout:6, fireball:8, heal:4, chain:5, book:5, guard:4, altar:6, sanctuary:5,
  aoe:6, fog:4, pierce:4, phantom:6, wall:6, titan:8, revive:5, egg:5, storm:3,
  kolopom:1, garakutan:2, nemurin:6, fizzlet:2, namerion:3, echoling:4, lastember:4, stackle:3, dongrim:4, sacrivel:3, hollowshell:4,
  tidecall:3, undertow:6, gloomcap:5, lullabam:5, riddlewisp:4, kindlefox:5, quillmouse:5, brambleback:6, ironhorn:8, tundrak:7,
  galeslash:3, lumend:6, ignavault:9, aurelion:9, nyxhollow:8, gaiaroot:6, gamblet:6, mimiq:6 };
function buildTemplate(attr){
  const cards={}; let n=0, mons=0, mags=0, flds=0, inAttr=0;
  const sc=id=>TSCORE[id]||3, avail=id=>Math.min(owned(id),cardLimit(id))-(cards[id]||0);
  const want=(id,core)=>{ const s=sc(id), lim=cardLimit(id); return core ? (s>=6?lim:s>=4?Math.min(2,lim):1) : (s>=6?Math.min(2,lim):1); };
  const ok=id=>{ const d=CARDS[id]; if(n>=CONFIG.deckSize || avail(id)<=0) return false; if(d.type==='field'&&flds>=2) return false; if(d.type==='magic'&&mags>=8) return false; return true; };
  const add1=(id,core)=>{ cards[id]=(cards[id]||0)+1; n++; if(core) inAttr++; const tp=CARDS[id].type; if(tp==='monster') mons++; else if(tp==='magic') mags++; else flds++; };
  const put=(id,k,core)=>{
    const base=CARDS[id].evolveFrom;
    if(base && !cards[base]){ if(!owned(base)) return; put(base,want(base,core),attrOf(base)===attr); if(!cards[base]) return; }
    for(let i=0;i<k && ok(id);i++) add1(id,core);
  };
  const byScore=list=>list.filter(id=>owned(id)).sort((a,b)=>sc(b)-sc(a));
  const mine=byScore(CARD_IDS.filter(id=>attrOf(id)===attr));
  const others=byScore(CARD_IDS.filter(id=>attrOf(id)!==attr));
  const isMon=id=>CARDS[id].type==='monster';
  for(const id of mine.filter(id=>sc(id)>=3 && isMon(id))) put(id,want(id,true),true);           // 1) 選んだ属性のモンスター
  for(const id of mine.filter(id=>sc(id)>=3 && !isMon(id))){ if(mags>=6 && CARDS[id].type==='magic') continue; put(id,want(id,true),true); } // 2) 選んだ属性のマジック（6枚まで）・フィールド
  for(const id of others.filter(id=>isMon(id) && sc(id)>=5)){ if(mons>=12) break; put(id,want(id,false),false); } // 3) モンスターが12体に満たなければ他の属性から補う
  for(const id of others){ if(n>=CONFIG.deckSize) break; put(id,want(id,false),false); }         // 4) 強い補助カード
  for(const id of [...mine,...others]) put(id,cardLimit(id),attrOf(id)===attr);                  // 5) それでも足りなければ何でも
  return {cards,n,inAttr};
}
function showTemplate(sel){
  const counts=Object.fromEntries(Object.keys(ATTR).map(a=>[a,CARD_IDS.filter(id=>attrOf(id)===a && owned(id)).length]));
  const total=Object.fromEntries(Object.keys(ATTR).map(a=>[a,CARD_IDS.filter(id=>attrOf(id)===a).length]));
  let preview='';
  if(sel){
    const r=buildTemplate(sel);
    const rows=CARD_IDS.filter(id=>r.cards[id]).sort((a,b)=>CARDS[a].cost-CARDS[b].cost).map(id=>`<div class="drow"><span class="dot el-${CARDS[id].el}"></span><span class="dmain"><span class="dname">${esc(cardName(id))} <span class="meta">${t('cost')}${CARDS[id].cost}</span></span><span class="dtext">${esc(effectLine(id))}</span></span><b class="num">×${r.cards[id]}</b></div>`).join('');
    preview=`<h3>${t('tmpl.preview')}</h3><p class="meta">${t('tmpl.mix',{a:t('attr.'+sel),x:r.inAttr,y:r.n-r.inAttr})}${r.n<CONFIG.deckSize?`　<span class="warnc">${t('tmpl.short',{n:r.n})}</span>`:''}</p><div class="dlist">${rows}</div>
      <p class="row"><button class="btn" data-act="tmplBuild" data-a="${sel}">${t('tmpl.make')}</button></p>`;
  }
  showModal(`<h2>${t('tmpl.title')}</h2><p class="meta">${t('tmpl.desc')}</p>
    <div class="attrgrid">${Object.keys(ATTR).map(a=>`<button class="attrbtn ${a===sel?'on':''}" data-act="tmplPick" data-a="${a}" style="--ac:${ATTR_COLOR[a]}"><span class="attrg">${ATTR_GLYPH[a]}</span><b>${t('attr.'+a)}</b><span class="meta">${t('tmpl.owned',{n:counts[a],m:total[a]})}</span></button>`).join('')}</div>
    ${preview}<p class="row"><button class="ghost-btn" data-act="closeModal">${t('close')}</button></p>`);
}
function applyTemplate(attr){
  const r=buildTemplate(attr), d=SV.decks[APP.editing];
  d.cards=r.cards; if(!d.name) d.name=t('tmpl.name',{a:t('attr.'+attr)});
  save(); closeModal(); renderApp(true);
  toast(r.n<CONFIG.deckSize ? t('tmpl.short',{n:r.n}) : t('tmpl.done',{a:t('attr.'+attr),n:r.n,m:CONFIG.deckSize}));
}

/* ----- カード詳細ビュー（大きなカード＋能力値） ----- */
const cardImgCache={};
function cardImg(id){ const k=id+'|'+LANG; if(!cardImgCache[k]){ try{ cardImgCache[k]=drawCardCanvas(id,2).toDataURL('image/png'); }catch(e){ cardImgCache[k]=''; } } return cardImgCache[k]; }
function navList(){
  if(APP.tab==='cards' && APP.cardsSub==='collection') return CARD_IDS.filter(id=>matchFilter(id,APP.filter));
  if(APP.tab==='cards' && APP.editing!=null) return CARD_IDS.filter(id=>owned(id) && matchFilter(id,APP.deckFilter||'all'));
  return [];
}
function evoLine(id){
  let root=id; while(CARDS[root].evolveFrom) root=CARDS[root].evolveFrom;
  if(root==='elderoak') root='dongrim';
  const line=[root]; let cur=root;
  for(let g=0; g<5; g++){ const nx=CARD_IDS.find(c=>CARDS[c].evolveFrom===cur) || (CARDS[cur].ref && CARDS[CARDS[cur].ref] ? CARDS[cur].ref : null); if(!nx || line.includes(nx)) break; line.push(nx); cur=nx; }
  return line.length>1 ? line : null;
}
const RAR_KEY={C:'rar.C',U:'rar.U',R:'rar.R',L:'rar.L'};
function showCard(id){
  const d=CARDS[id], n=owned(id), cost=RARITY[d.rarity].craft, list=navList(), at=list.indexOf(id), a=attrOf(id);
  const prev=at>0?list[at-1]:null, next=at>=0&&at<list.length-1?list[at+1]:null;
  const img=cardImg(id), evo=evoLine(id);
  const tile=(k,v,cls='')=>`<div class="cvt ${cls}"><span class="lbl">${k}</span><b class="num">${v}</b></div>`;
  showModal(`<div class="cv rar-${d.rarity}" style="--el:${EL[d.el]}">
    <div class="cv-head"><span class="cv-rar">${RARITY[d.rarity].mark} ${t(RAR_KEY[d.rarity])}</span><h2>${esc(cardName(id))}</h2><span class="meta">${esc(cardMotif(id))}</span></div>
    <div class="cv-stage">
      <button class="cv-nav" data-act="cardNav" data-id="${prev||''}" ${prev?'':'disabled'} aria-label="${t('cv.prev')}">‹</button>
      <div class="cv-card ${SV.foil[id]?'foil':''}" id="cvCard">${img?`<img src="${img}" alt="${esc(cardName(id))}" draggable="false">`:cardHTML(id,'big')}<span class="cv-sheen"></span></div>
      <button class="cv-nav" data-act="cardNav" data-id="${next||''}" ${next?'':'disabled'} aria-label="${t('cv.next')}">›</button>
    </div>
    ${at>=0?`<p class="meta center">${at+1} / ${list.length}</p>`:''}
    <div class="cv-tiles">
      ${tile(t('cost'),d.cost,'gold')}
      ${d.type==='monster'?tile('ATK',d.atk,'atk')+tile('HP',d.hp,'hp'):''}
      ${tile(t('cv.type'),d.tag?t('tag.'+d.tag):t('kind.'+d.type))}
      ${a?tile(t('cv.attr'),`<span style="color:${ATTR_COLOR[a]}">${ATTR_GLYPH[a]}</span> ${t('attr.'+a)}`):''}
      ${tile(t('cv.limit'),d.token?'—':cardLimit(id))}
      ${tile(t('cv.owned'),d.token?'—':n)}
      ${SV.foil[id]?tile(t('cv.foil'),'✦'+SV.foil[id],'gold'):''}
    </div>
    ${cardText(id)?`<div class="cv-desc">${esc(cardText(id))}</div>`:`<div class="cv-desc meta">${t('cv.vanilla')}</div>`}
    ${evo?`<h3>${t('cv.evo')}</h3><div class="evo">${evo.map((e,i)=>`${i?'<span class="evo-arrow">→</span>':''}<button class="evo-card ${e===id?'on':''}" data-act="cardNav" data-id="${e}" style="--cw:64px">${cardHTML(e)}</button>`).join('')}</div>`:''}
    ${canPaint(id)?`<div class="paintbox"><button class="btn paintbtn" data-act="paint" data-id="${id}">${paintUnlocked(id)?t('paint.open'):t('paint.unlockShort',{p:PAINT_COST[d.rarity]})}</button>${painted(id)?`<span class="badge">${t('paint.painted')}</span>`:''}</div>`:''}
    ${deckCtl(id)}
    ${d.token?'':`<div class="craftbox"><span class="lbl">${t('home.points')} <b class="num gold">${SV.points}</b></span><div class="row">${canCraft(id)?`<button class="${APP.editing!=null&&APP.tab==='cards'?'ghost-btn':'btn'}" data-act="craft" data-id="${id}" ${SV.points>=cost?'':'disabled'}>${t('craft',{p:cost})}</button>`:`<span class="meta">${t('craft.max')}</span>`}${extraOf(id)?`<button class="ghost-btn" data-act="dust" data-id="${id}">${t('dust.btn',{n:extraOf(id),p:extraOf(id)*dustOf(id)})}</button>`:''}</div></div>`}
    <div class="row"><button class="ghost-btn" data-act="closeModal">${t('close')}</button></div>
  </div>`,'cv-modal');
  bindTilt();
}
function bindTilt(){
  const el=$('#cvCard'); if(!el || !el.addEventListener) return;
  const move=e=>{ const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5; el.style.setProperty('--rx',(-y*16).toFixed(1)+'deg'); el.style.setProperty('--ry',(x*18).toFixed(1)+'deg'); el.style.setProperty('--sx',((x+.5)*100).toFixed(0)+'%'); };
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerleave',()=>{ el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg'); });
  let sx=null; el.addEventListener('pointerdown',e=>{ sx=e.clientX; });
  el.addEventListener('pointerup',e=>{ if(sx==null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50){ const b=document.querySelectorAll('.cv-nav')[dx<0?1:0]; if(b && !b.disabled) showCard(b.dataset.id); } });
}

  const seg=`<div class="seg"><button class="${APP.cardsSub==='collection'?'on':''}" data-act="sub" data-sub="collection">${t('cards.collection')}</button><button class="${APP.cardsSub==='decks'?'on':''}" data-act="sub" data-sub="decks">${t('cards.decks')}</button></div>`;
  if(APP.cardsSub==='collection') return seg+collectionHTML();
  return seg+(APP.editing==null ? decksHTML() : deckEditHTML(APP.editing));
}
// 絞り込みチップ（コレクションとデッキ編集で共通）
function filterChips(act,f){ return ['all','monster','magic','field'].map(k=>`<button class="chip ${f===k?'on':''}" data-act="${act}" data-f="${k}">${k==='all'?t('filter.all'):t('kind.'+k)}</button>`).join(''); }
function matchFilter(id,f){ return f==='all' || CARDS[id].type===f; }
// カードの能力を1行で（モンスターはATK/HPも付ける）
function effectLine(id){ const d=CARDS[id], tx=cardText(id); return d.type==='monster' ? `ATK ${d.atk} / HP ${d.hp}${tx?'　'+tx:''}` : tx; }
function collectionHTML(){
  const f=APP.filter;
  const chips=filterChips('filter',f);
  const ids=CARD_IDS.filter(id=>matchFilter(id,f));
  const ownedCount=CARD_IDS.filter(id=>SV.collection[id]).length;
  const ex=allExtras();
  return `<div class="row between"><div class="chips">${chips}</div><span class="meta">${t('home.dex')} ${ownedCount}/${CARD_IDS.length}</span></div>
    <div class="row between"><span class="meta">${t('dust.hint')}</span>${ex.length?`<button class="ghost-btn sm" data-act="dustAll">${t('dust.allBtn',{p:ex.reduce((s,x)=>s+x.p,0)})}</button>`:''}</div>
    <div class="grid">${ids.map(id=>{ const n=owned(id); return `<button class="cell ${n?'':'unowned'} ${SV.foil[id]?'hasfoil':''}" data-act="card" data-id="${id}">${cardHTML(id)}${SV.foil[id]?`<span class="foilmark">✦${SV.foil[id]}</span>`:''}${painted(id)?`<span class="paintb">${t('paint.mark')}</span>`:''}<span class="cnt">×${n}</span><span class="rar">${RARITY[CARDS[id].rarity].mark}</span></button>`; }).join('')}</div>`;

   開発者画面（設定の「バージョン」を7回押すと出てくる）
   確率の変更・全カード解放はこの端末で開発者モードがオンのときだけ効く
   ===================================================================== */
function devOn(){ return BUILD==='dev' && !!(SV?.dev?.enabled); }
function owned(id){ return devOn() && SV.dev.allCards ? cardLimit(id) : (SV.collection[id]||0); }
function effRates(){ if(devOn() && SV.dev.rates) return SV.dev.rates; const r={}; for(const [k,v] of Object.entries(RARITY)) r[k]=v.rate; return r; }
function effGod(){ return devOn() && SV.dev.god!=null ? SV.dev.god : CONFIG.godPackRate; }
function randDeck(){
  const c={}; let n=0, guard=0;
  while(n<CONFIG.deckSize && guard++<2000){
    const id=CARD_IDS[Math.floor(Math.random()*CARD_IDS.length)];
    if((c[id]||0)>=cardLimit(id)) continue;
    const ev=CARDS[id].evolveFrom; if(ev && !c[ev]) continue;
    c[id]=(c[id]||0)+1; n++;
  }
  return c;
}
function forceHand(p,ids){
  p.deck.push(...p.hand); p.hand=[];
  for(const id of ids){
    const k=p.deck.findIndex(c=>c.id===id);
    p.hand.push(k>=0 ? p.deck.splice(k,1)[0] : {uid:++uidSeq,id});
  }
  shuffle(p.deck);
}

// ----- ギフトコード（簡易版：公開前にサーバー側へ置き換える） -----
const GIFT_SALT='gate-dev-v1';
function fnv(s){ let h=0x811c9dc5; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,0x01000193)>>>0; } return h.toString(36).toUpperCase(); }
function b64u(s){ return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return atob(s); }
function makeGift(to,id,n,pts){ const p=b64u(JSON.stringify({v:1,to,id:id||null,n:n||0,pts:pts||0,k:randId()})); return 'GIFT1-'+p+'-'+fnv(GIFT_SALT+p); }
function redeemGift(code){
  const m=String(code||'').trim().match(/^GIFT1-([A-Za-z0-9_-]+)-([A-Z0-9]+)$/);
  if(!m || fnv(GIFT_SALT+m[1])!==m[2]) return t('gift.bad');
  let g; try{ g=JSON.parse(unb64u(m[1])); }catch(e){ return t('gift.bad'); }
  if(g.to!==SV.profile.id) return t('gift.notYou');
  SV.usedGifts=SV.usedGifts||[];
  if(SV.usedGifts.includes(g.k)) return t('gift.used');
  const msgs=[];
  if(g.id && CARDS[g.id] && g.n>0){ SV.collection[g.id]=(SV.collection[g.id]||0)+Math.min(99,g.n); msgs.push(t('gift.ok',{c:'@'+g.id,n:g.n})); }
  if(g.pts>0){ SV.points+=Math.min(9999,g.pts); msgs.push(t('gift.pts',{n:g.pts})); }
  if(!msgs.length) return t('gift.bad');
  SV.usedGifts.push(g.k); save();
  return msgs.join(' / ');
}

      SV.pending=null; save(); toast(t('dev.saved')); renderApp(true); return true; }
    case 'devRatesReset': D.rates=null; D.god=null; SV.pending=null; save(); toast(t('dev.saved')); renderApp(true); return true;
    case 'devSetPack': {

    case 'devPoints': { const n=Math.min(9999,Math.max(1,+$('#devPts').value||0)); SV.points+=n; save(); toast(t('dev.added')); renderApp(true); return true; }

    case 'rules': showRules(); return;

    case 'deckBack': APP.editing=null; renderApp(); return;
    case 'deckUse': SV.active=+d.i; save(); renderApp(true); return;
    case 'deckAdd': deckAdd(d.id); return;
    case 'deckRemove': { const c=SV.decks[APP.editing].cards; if(c[d.id]>1) c[d.id]--; else delete c[d.id]; save(); renderApp(true); return; }
    case 'deckClear': SV.decks[APP.editing].cards={}; save(); renderApp(true); return;

    case 'friendBattle': startMatch('friend',+d.i); return;

    case 'startFriend': startMatch('friend',+($('#friendSel')?.value||0)); return;

    case 'speed': SV.settings.speed=+d.v; CONFIG.animSpeed=+d.v; save(); renderApp(true); return;
    case 'viewSet': SV.settings.view=+d.v; viewIdx=+d.v; save(); fitCamera(); renderApp(true); return;

function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function wrapText(g,text,maxW,maxLines){
  const cjk=/[぀-ヿ㐀-鿿가-힯]/.test(text);
  const tokens=cjk?[...text]:text.split(/(\s+)/);
  const out=[]; let line='';
  for(const tk of tokens){
    const test=line+tk;
    if(g.measureText(test).width>maxW && line.trim()){ out.push(line.trim()); line=tk.trim()?tk:''; if(out.length>=maxLines) return out; }
    else line=test;
  }
  if(line.trim() && out.length<maxLines) out.push(line.trim());
  return out;
}

function wingGeo(){ const s=new THREE.Shape(); s.moveTo(0,0); s.lineTo(.5,.45); s.lineTo(1.35,.55); s.lineTo(1.05,.05); s.lineTo(1.15,-.25); s.lineTo(.7,-.15); s.lineTo(.55,-.45); s.lineTo(0,-.2); return new THREE.ShapeGeometry(s); }
function addWings(g,mat,x,y,z,size){
  const ws=[];
  for(const side of [1,-1]){
    const pivot=new THREE.Group(); pivot.position.set(side*x,y,z); pivot.scale.set(side*size,size,size);
    const w=new THREE.Mesh(wingGeo(),mat); w.rotation.x=-Math.PI/2+.25; w.castShadow=true; pivot.add(w);

function removeEnt(e,withFx){

function updateEnt(e,m,pi){

    const g=new THREE.Group(); g.add(d,w); g.scale.setScalar(.01); e.root.add(g); e.dome=g;
    tween(.5,k=>g.scale.set(easeBack(k),easeBack(k)*1.6,easeBack(k)));

function sync3D(){

    if(!m) return; alive.add(m.uid);

/* --- エフェクト --- */
function burst(pos,color,n=40,speed=4,life=.8,size=.2,gravity=4){
  const arr=new Float32Array(n*3), vel=[];
  for(let i=0;i<n;i++){
    arr[i*3]=pos.x; arr[i*3+1]=pos.y; arr[i*3+2]=pos.z;
    vel.push(V(Math.random()-.5,Math.random()*.8+.2,Math.random()-.5).normalize().multiplyScalar(speed*(.3+Math.random()*.7)));
  }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const mat=new THREE.PointsMaterial({color:col(color),size:size*WS,map:DOT_TEX,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(geo,mat); world.add(pts);
  bursts.push({pts,vel,age:0,life:life/CONFIG.animSpeed,gravity});
}
function updateBursts(dt){
  for(let j=bursts.length-1;j>=0;j--){
    const b=bursts[j]; b.age+=dt;
    const a=b.pts.geometry.attributes.position, arr=a.array;
    for(let i=0;i<b.vel.length;i++){ const v=b.vel[i]; arr[i*3]+=v.x*dt; arr[i*3+1]+=v.y*dt; arr[i*3+2]+=v.z*dt; v.y-=b.gravity*dt; v.multiplyScalar(.985); }
    a.needsUpdate=true; b.pts.material.opacity=Math.max(0,1-b.age/b.life);
    if(b.age>=b.life){ world.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(j,1); }
  }
}
function magicCircle(pos,color,size,dur){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({map:CIRCLE_TEX,color:col(color),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2; m.position.copy(pos); world.add(m);
  return tween(dur,k=>{ m.scale.setScalar(size*(.3+.7*easeOut(Math.min(1,k*2)))); m.rotation.z=k*3; m.material.opacity=k<.2?k*5:(1-k)/.8; }).then(()=>{ world.remove(m); m.material.dispose(); });
}
function pillar(pos,color,h,dur,r=.8){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,28,1,true), new THREE.MeshBasicMaterial({color:col(color),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.position.copy(pos); m.position.y=h/2; world.add(m);
  return tween(dur,k=>{ m.scale.set(1-k*.5,easeOut(Math.min(1,k*3)),1-k*.5); m.material.opacity=(1-k)*.55; }).then(()=>{ world.remove(m); m.material.dispose(); });
}

async function projectile(a,b,color){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10), new THREE.MeshBasicMaterial({color:col(color)}));
  const halo=new THREE.Mesh(new THREE.SphereGeometry(.45,12,10), new THREE.MeshBasicMaterial({color:col(color),transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));

  world.remove(m); fxLight.intensity=0;
  burst(b,color,80,5,.8,.24); burst(b,'#ffffff',20,3,.3,.3); shake(.3);
}

  base.position.y=-.31; world.add(base);
  const trim=M(0x8a6e34,{metalness:.8,roughness:.35,flatShading:false});
  for(const [w,d,x,z] of [[12.6,.18,0,7.2],[12.6,.18,0,-7.2],[.18,14.6,6.2,0],[.18,14.6,-6.2,0]]){ const b=new THREE.Mesh(new THREE.BoxGeometry(w,.16,d),trim); b.position.set(x,.02,z); world.add(b); }

  const mg=new THREE.BufferGeometry(); mg.setAttribute('position',new THREE.BufferAttribute(arr,3));

function pick(e){
  const ndc=new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(hitList,false);
  return hits.length ? hits[0].object.userData : null;
}
function fitCamera(){
  if(renderer.xr.isPresenting) return;
  const W=innerWidth, H=innerHeight; renderer.setSize(W,H);
  camera.aspect=W/H;
  const v=VIEWS[viewIdx], vf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const needHalf = viewIdx===0 ? 6.6 : 5.4;
  const dist=Math.max(v.dist, needHalf/(vf*camera.aspect)*.92);
  camLook.set(...v.look);
  camBase.set(...v.dir).normalize().multiplyScalar(dist).add(camLook);
  scene.fog.near=dist+4; scene.fog.far=dist+26;
  const hb=document.querySelector('.hud-bottom'), ht=document.querySelector('.hud-top');
  const off=((hb?hb.offsetHeight:0)-(ht?ht.offsetHeight:0))*.5;
  camera.setViewOffset(W,H,0,off,W,H);
  camera.updateProjectionMatrix();
}
function loop(){
  const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime;
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; if(!tw) continue; tw.t+=dt; const k=Math.min(1,tw.t/tw.dur); tw.fn(k); if(k>=1){ tweens.splice(i,1); tw.res(); } }
  updateBursts(dt);
  for(const e of models.values()){
    e.lift+=(e.liftT-e.lift)*Math.min(1,dt*10);
    const amp=e.model.userData.flyer?.12:.05;
    e.pivot.position.y=e.lift+Math.sin(t*2+e.phase)*amp+(e.model.userData.flyer?.15:0);
    e.pivot.position.x=e.shakeT>0?Math.sin(t*90)*.1*e.shakeT/.4:0; if(e.shakeT>0) e.shakeT-=dt;
    const ws=e.model.userData.wings; if(ws) for(const w of ws) w.rotation.z=w.userData.side*(.35+Math.sin(t*e.model.userData.flap+e.phase)*.4);
    if(e.model.userData.sword) e.model.userData.sword.rotation.z=Math.sin(t*1.5+e.phase)*.08;
    if(e.ring.visible){ e.ring.material.opacity=.55+Math.sin(t*5)*.3; e.ring.rotation.z=t*.6; }
    if(e.chain) e.chain.rotation.y=t*1.2;
    if(e.dome) e.dome.rotation.y=t*.4;
  }
  for(const c of crystals){
    c.gem.rotation.y=t*.8; c.orbs.rotation.y=-t*1.4;
    c.list.forEach((o,i)=>{ const a=i/c.list.length*Math.PI*2; o.position.set(Math.cos(a)*1.0,Math.sin(t*2+i)*.15,Math.sin(a)*1.0); });
    if(c.hitT>0){ c.hitT-=dt; c.gem.scale.set(1+c.hitT*.6,1.5+c.hitT*.6,1+c.hitT*.6); } else c.gem.scale.set(1,1.5,1);
    c.gem.position.y=Math.sin(t*1.6)*.1;
    if(c.ring.visible){ c.ring.material.opacity=.55+Math.sin(t*5)*.3; }
  }
  for(const f of fieldEnts) if(f) f.rune.rotation.z=t*.5;
  scene.traverse(o=>{ if(o.userData.spin) o.rotation.y=t; });
  const ma=_motes.geometry.attributes.position; for(let i=0;i<ma.count;i++){ let y=ma.array[i*3+1]+dt*.25; if(y>8) y=0; ma.array[i*3+1]=y; } ma.needsUpdate=true;
  if(!S && !renderer.xr.isPresenting){ const a=t*.07; camera.position.set(Math.sin(a)*15,9.5,Math.cos(a)*15); camera.lookAt(0,0,0); renderer.render(scene,camera); return; }
  camera.position.copy(camBase);

async function startXR(mode){
  if(!navigator.xr) return;
  try{
    const session=await navigator.xr.requestSession(mode,{optionalFeatures:['local-floor','hand-tracking']});
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(session);
    xrMode=mode; enterXR();
    session.addEventListener('end',exitXR);
  }catch(e){ if(S){ setHint('w.xr',null,true); render(); } }
}
function enterXR(){
  xrSaved={fog:scene.fog,bg:scene.background};

  scene.fog=null;

  _motes.material.size=.09*WS;
  xrHud.visible=true;
  render();
}
function exitXR(){
  WS=1; world.scale.setScalar(1); world.position.set(0,0,0);

  floorMesh.visible=true; propsGroup.visible=true; _motes.material.size=.09;

function onXRSelect(e){
  const ctl=e.target, rot=new THREE.Matrix4().extractRotation(ctl.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(ctl.matrixWorld);

  if(!hits.length){ if(S?.sel){ S.sel=null; setHint(''); render(); } return; }
  const d=hits[0].object.userData;
  if(d.act==='end' && S?.over){ startMatch(S.mode,S.friendIdx); return; }

}
